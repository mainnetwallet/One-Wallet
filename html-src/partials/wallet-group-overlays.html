<!-- ══════ WALLET GROUP DETAIL UI ══════ -->
<div id="wgd-overlay" style="display:none;position:fixed;top:0;left:0;right:0;bottom:calc(var(--nav-height) + env(safe-area-inset-bottom, 0px));z-index:790;background:rgba(2,2,10,0.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);align-items:flex-end;justify-content:center;" onclick="if(event.target===this)closeWgDetailUI()">
  <div style="width:100%;max-width:480px;background:linear-gradient(180deg,#0d0d1f 0%,#080812 100%);border-radius:32px 32px 0 0;overflow:hidden;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 -2px 0 0 rgba(99,102,241,0.35),0 -16px 64px rgba(0,0,0,0.75),0 -4px 24px rgba(99,102,241,0.12);border-top:1px solid rgba(99,102,241,0.25);border-left:1px solid rgba(255,255,255,0.05);border-right:1px solid rgba(255,255,255,0.05);">

    <!-- Drag handle -->
    <div style="display:flex;justify-content:center;padding:14px 0 6px;flex-shrink:0;">
      <div style="width:40px;height:4px;border-radius:2px;background:linear-gradient(90deg,rgba(99,102,241,0.5),rgba(139,92,246,0.5));box-shadow:0 0 8px rgba(99,102,241,0.35);"></div>
    </div>

    <!-- Header -->
    <div style="display:flex;align-items:center;gap:14px;padding:10px 18px 14px;flex-shrink:0;">
      <div onclick="closeWgDetailUI()" style="width:40px;height:40px;border-radius:14px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.09);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all 0.18s;" onmousedown="this.style.background='rgba(99,102,241,0.18)';this.style.transform='scale(0.92)'" onmouseup="this.style.background='rgba(255,255,255,0.05)';this.style.transform=''" ontouchstart="this.style.background='rgba(99,102,241,0.18)';this.style.transform='scale(0.92)'" ontouchend="this.style.background='rgba(255,255,255,0.05)';this.style.transform=''">
        <span class="material-icons-round" style="font-size:19px;color:var(--text-secondary);">arrow_back</span>
      </div>
      <div style="flex:1;min-width:0;">
        <div id="wgd-title" style="font-size:18px;font-weight:800;letter-spacing:0.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--font-display);background:linear-gradient(135deg,#e0e0ff,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;"></div>
        <div id="wgd-subtitle" style="font-size:10px;color:rgba(99,102,241,0.6);font-family:var(--font-mono);letter-spacing:1.8px;margin-top:3px;text-transform:uppercase;"></div>
      </div>
      <!-- Wallet count pill -->
      <div id="wgd-count-pill" style="padding:5px 12px;border-radius:20px;background:rgba(99,102,241,0.13);border:1px solid rgba(99,102,241,0.28);font-size:10px;font-weight:800;font-family:var(--font-mono);color:var(--neon-purple);letter-spacing:1px;flex-shrink:0;"></div>
    </div>

    <!-- Copy all action bar -->
    <div id="wgd-action-bar" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 18px 16px;flex-shrink:0;">
      <button onclick="wgdCopyAllAddresses()" style="display:flex;align-items:center;justify-content:center;gap:9px;padding:14px 10px;background:linear-gradient(135deg,rgba(99,102,241,0.16),rgba(139,92,246,0.10));border:1px solid rgba(99,102,241,0.32);border-radius:16px;cursor:pointer;transition:all 0.18s;position:relative;overflow:hidden;" onmousedown="this.style.transform='scale(0.96)';this.style.background='linear-gradient(135deg,rgba(99,102,241,0.26),rgba(139,92,246,0.18))'" onmouseup="this.style.transform='';this.style.background='linear-gradient(135deg,rgba(99,102,241,0.16),rgba(139,92,246,0.10))'" ontouchstart="this.style.transform='scale(0.96)';this.style.background='linear-gradient(135deg,rgba(99,102,241,0.26),rgba(139,92,246,0.18))'" ontouchend="this.style.transform='';this.style.background='linear-gradient(135deg,rgba(99,102,241,0.16),rgba(139,92,246,0.10))'">
        <div style="width:30px;height:30px;border-radius:9px;background:rgba(99,102,241,0.2);border:1px solid rgba(99,102,241,0.35);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <span class="material-icons-round" style="font-size:15px;color:var(--neon-purple);">account_balance_wallet</span>
        </div>
        <div style="text-align:left;">
          <div style="font-size:10px;font-weight:800;color:var(--neon-purple);font-family:var(--font-mono);letter-spacing:0.8px;">COPY ALL</div>
          <div style="font-size:9px;color:rgba(167,139,250,0.55);font-family:var(--font-mono);letter-spacing:0.4px;margin-top:1px;">ADDRESSES</div>
        </div>
      </button>
      <button onclick="wgdCopyAllKeys()" style="display:flex;align-items:center;justify-content:center;gap:9px;padding:14px 10px;background:linear-gradient(135deg,rgba(245,158,11,0.14),rgba(251,191,36,0.07));border:1px solid rgba(245,158,11,0.32);border-radius:16px;cursor:pointer;transition:all 0.18s;" onmousedown="this.style.transform='scale(0.96)';this.style.background='linear-gradient(135deg,rgba(245,158,11,0.24),rgba(251,191,36,0.15))'" onmouseup="this.style.transform='';this.style.background='linear-gradient(135deg,rgba(245,158,11,0.14),rgba(251,191,36,0.07))'" ontouchstart="this.style.transform='scale(0.96)';this.style.background='linear-gradient(135deg,rgba(245,158,11,0.24),rgba(251,191,36,0.15))'" ontouchend="this.style.transform='';this.style.background='linear-gradient(135deg,rgba(245,158,11,0.14),rgba(251,191,36,0.07))'">
        <div style="width:30px;height:30px;border-radius:9px;background:rgba(245,158,11,0.15);border:1px solid rgba(245,158,11,0.32);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <span class="material-icons-round" style="font-size:15px;color:var(--accent-amber);">vpn_key</span>
        </div>
        <div style="text-align:left;">
          <div style="font-size:10px;font-weight:800;color:var(--accent-amber);font-family:var(--font-mono);letter-spacing:0.8px;">COPY ALL</div>
          <div style="font-size:9px;color:rgba(245,158,11,0.5);font-family:var(--font-mono);letter-spacing:0.4px;margin-top:1px;">PRIVATE KEYS</div>
        </div>
      </button>
      <button id="wgd-copy-phrase-btn" onclick="wgdCopyAllPhrases()" style="display:none;align-items:center;justify-content:center;gap:9px;padding:12px 10px;background:linear-gradient(135deg,rgba(16,185,129,0.14),rgba(52,211,153,0.07));border:1px solid rgba(16,185,129,0.32);border-radius:16px;cursor:pointer;transition:all 0.18s;grid-column:1/-1;" onmousedown="this.style.transform='scale(0.96)';this.style.background='linear-gradient(135deg,rgba(16,185,129,0.24),rgba(52,211,153,0.15))'" onmouseup="this.style.transform='';this.style.background='linear-gradient(135deg,rgba(16,185,129,0.14),rgba(52,211,153,0.07))'" ontouchstart="this.style.transform='scale(0.96)';this.style.background='linear-gradient(135deg,rgba(16,185,129,0.24),rgba(52,211,153,0.15))'" ontouchend="this.style.transform='';this.style.background='linear-gradient(135deg,rgba(16,185,129,0.14),rgba(52,211,153,0.07))'">
        <div style="width:28px;height:28px;border-radius:9px;background:rgba(16,185,129,0.18);border:1px solid rgba(16,185,129,0.35);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <span class="material-icons-round" style="font-size:14px;color:#34d399;">menu_book</span>
        </div>
        <div style="text-align:left;">
          <div style="font-size:10px;font-weight:800;color:#34d399;font-family:var(--font-mono);letter-spacing:0.8px;">COPY PHRASES</div>
          <div style="font-size:9px;color:rgba(52,211,153,0.5);font-family:var(--font-mono);letter-spacing:0.4px;margin-top:1px;">SEED MNEMONICS</div>
        </div>
      </button>
    </div>

    <!-- Divider with glow -->
    <div style="height:1px;background:linear-gradient(90deg,transparent,rgba(99,102,241,0.25),rgba(139,92,246,0.2),transparent);margin:0 18px;flex-shrink:0;"></div>

    <!-- Wallet list -->
    <div id="wgd-wallet-list" style="flex:1;overflow-y:auto;padding:14px 18px 40px;display:flex;flex-direction:column;gap:10px;scrollbar-width:none;-webkit-overflow-scrolling:touch;"></div>
  </div>
</div>

<!-- ══════ EDIT KEYS MODAL ══════ -->
<div id="wgek-overlay" style="display:none;position:fixed;top:0;left:0;right:0;bottom:calc(var(--nav-height) + env(safe-area-inset-bottom, 0px));z-index:800;background:rgba(2,2,10,0.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);align-items:flex-end;justify-content:center;" onclick="if(event.target===this)closeWgekModal()">
  <div style="width:100%;max-width:480px;background:linear-gradient(180deg,#0f0b1a 0%,#08060f 100%);border-radius:32px 32px 0 0;overflow:hidden;max-height:84vh;display:flex;flex-direction:column;box-shadow:0 -2px 0 0 rgba(244,63,94,0.4),0 -16px 64px rgba(0,0,0,0.75),0 -4px 24px rgba(244,63,94,0.1);border-top:1px solid rgba(244,63,94,0.22);border-left:1px solid rgba(255,255,255,0.04);border-right:1px solid rgba(255,255,255,0.04);">
    <!-- Drag handle -->
    <div style="display:flex;justify-content:center;padding:14px 0 6px;flex-shrink:0;">
      <div style="width:40px;height:4px;border-radius:2px;background:linear-gradient(90deg,rgba(244,63,94,0.5),rgba(225,29,72,0.4));box-shadow:0 0 8px rgba(244,63,94,0.3);"></div>
    </div>
    <!-- Header -->
    <div style="display:flex;align-items:center;gap:14px;padding:10px 18px 14px;flex-shrink:0;">
      <div onclick="closeWgekModal()" style="width:40px;height:40px;border-radius:14px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all 0.18s;" onmousedown="this.style.background='rgba(244,63,94,0.15)';this.style.transform='scale(0.92)'" onmouseup="this.style.background='rgba(255,255,255,0.05)';this.style.transform=''" ontouchstart="this.style.background='rgba(244,63,94,0.15)';this.style.transform='scale(0.92)'" ontouchend="this.style.background='rgba(255,255,255,0.05)';this.style.transform=''">
        <span class="material-icons-round" style="font-size:19px;color:var(--text-secondary);">arrow_back</span>
      </div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:18px;font-weight:800;font-family:var(--font-display);letter-spacing:0.2px;background:linear-gradient(135deg,#ffe4e8,#f87171);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">Edit Keys</div>
        <div id="wgek-title" style="font-size:10px;color:rgba(244,63,94,0.55);font-family:var(--font-mono);letter-spacing:1.8px;margin-top:3px;text-transform:uppercase;"></div>
      </div>
      <!-- Tap to select badge -->
      <div style="display:flex;align-items:center;gap:5px;padding:6px 11px;border-radius:20px;background:rgba(244,63,94,0.1);border:1px solid rgba(244,63,94,0.28);">
        <span class="material-icons-round" style="font-size:12px;color:var(--accent-red);">touch_app</span>
        <span style="font-size:9px;font-weight:800;color:var(--accent-red);font-family:var(--font-mono);letter-spacing:0.8px;">SELECT</span>
      </div>
    </div>
    <!-- Divider -->
    <div style="height:1px;background:linear-gradient(90deg,transparent,rgba(244,63,94,0.22),rgba(225,29,72,0.18),transparent);margin:0 18px;flex-shrink:0;"></div>
    <!-- Key list -->
    <div id="wgek-key-list" style="flex:1;overflow-y:auto;padding:14px 18px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch;"></div>
    <!-- Remove button -->
    <div style="padding:14px 18px 40px;flex-shrink:0;">
      <button id="wgek-remove-btn" onclick="wgekRemoveSelected()"
        style="width:100%;padding:16px;background:linear-gradient(135deg,#f43f5e,#e11d48);border:none;border-radius:18px;color:#fff;font-family:var(--font-display);font-size:13px;font-weight:800;cursor:pointer;letter-spacing:1px;opacity:0.3;pointer-events:none;transition:all 0.22s;box-shadow:0 6px 24px rgba(244,63,94,0.35),0 2px 8px rgba(244,63,94,0.2);">
        REMOVE SELECTED
      </button>
    </div>
  </div>
</div>

<!-- ══════ WALLET GROUP MANAGER MODAL ══════ -->
<div class="send-overlay" id="wgm-overlay" style="z-index:750;">
  <div class="send-modal">

    <!-- Header -->
    <div class="send-header">
      <div class="send-back-btn" onclick="closeWgManager()">
        <span class="material-icons-round">arrow_back</span>
      </div>
      <div class="send-header-title">Wallet Groups</div>
      <div id="wgm-count-badge" style="padding:4px 10px;border-radius:8px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);font-size:10px;font-weight:700;color:var(--neon-purple);font-family:var(--font-mono);">0 GROUPS</div>
    </div>

    <div class="send-body" style="padding:16px 20px 40px;">

      <!-- Empty state -->
      <div id="wgm-empty" style="display:none;text-align:center;padding:40px 20px;">
        <div style="width:56px;height:56px;border-radius:16px;background:var(--bg-glass);border:1px solid var(--border-subtle);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">
          <span class="material-icons-round" style="font-size:28px;color:var(--text-muted);">folder_off</span>
        </div>
        <div style="font-size:14px;font-weight:700;margin-bottom:6px;">No Wallet Groups</div>
        <div style="font-size:11px;color:var(--text-muted);font-family:var(--font-mono);">Import groups in Settings to get started</div>
      </div>

      <!-- Groups list -->
      <div id="wgm-list" style="display:flex;flex-direction:column;gap:10px;"></div>

    </div>
  </div>
</div>
