    <!-- ╔══════ BASE SWAP BOT PAGE ══════╗ -->
    <div class="page" id="page-base-swap-bot" style="padding-bottom:20px;">

      <!-- Header -->
      <div style="display:flex;align-items:center;gap:14px;padding:18px 20px 12px;">
        <div onclick="switchPage('profile');rippleEffect(this,event)" style="width:36px;height:36px;border-radius:12px;background:var(--bg-glass);border:1px solid var(--border-subtle);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;" onmousedown="this.style.background='var(--bg-glass-hover)'" onmouseup="this.style.background='var(--bg-glass)'" ontouchstart="this.style.background='var(--bg-glass-hover)'" ontouchend="this.style.background='var(--bg-glass)'">
          <span class="material-icons-round" style="color:var(--text-secondary);font-size:20px;">arrow_back</span>
        </div>
        <div>
          <div style="font-family:var(--font-display);font-size:18px;font-weight:700;color:var(--text-primary);">Base Swap Bot</div>
          <div style="font-size:11px;color:var(--text-secondary);margin-top:1px;"></div>
        </div>
        <div style="margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;">
        </div>
      </div>

      <!-- Step Bar -->
      <div style="display:flex;align-items:center;padding:4px 20px 10px;">
        <div id="bsb-si1" class="bsb-step-item bsb-done" onclick="bsbGoStep(1)" style="display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;cursor:pointer;">
          <div id="bsb-sc1" class="bsb-step-circle" style="width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;border:2px solid #10b981;background:#10b981;color:#fff;font-family:var(--font-mono);">✓</div>
          <div style="font-size:9px;color:#10b981;font-family:var(--font-mono);">Network</div>
        </div>
        <div id="bsb-conn1" style="flex:1;height:2px;background:#10b981;margin:0 4px;margin-bottom:14px;max-width:40px;"></div>
        <div id="bsb-si2" class="bsb-step-item bsb-active" onclick="bsbGoStep(2)" style="display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;cursor:pointer;">
          <div id="bsb-sc2" class="bsb-step-circle" style="width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;border:2px solid #3b82f6;background:#3b82f6;color:#fff;box-shadow:0 0 12px rgba(59,130,246,.4);font-family:var(--font-mono);">2</div>
          <div style="font-size:9px;color:#3b82f6;font-family:var(--font-mono);">Keys</div>
        </div>
        <div id="bsb-conn2" style="flex:1;height:2px;background:var(--border-subtle);margin:0 4px;margin-bottom:14px;max-width:40px;"></div>
        <div id="bsb-si3" class="bsb-step-item" onclick="bsbGoStep(3)" style="display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;cursor:pointer;">
          <div id="bsb-sc3" class="bsb-step-circle" style="width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;border:2px solid var(--border-subtle);background:var(--bg-raised);color:var(--text-muted);font-family:var(--font-mono);">3</div>
          <div style="font-size:9px;color:var(--text-muted);font-family:var(--font-mono);">Run</div>
        </div>
      </div>

      <!-- Scrollable Content -->
      <div id="bsb-container" style="flex:1;padding:0 16px;overflow-y:auto;padding-bottom:100px;">

        <!--@include partials/page-base-swap-bot/bsb-step1-network-config.html-->

        <!--@include partials/page-base-swap-bot/bsb-step2-keys-settings.html-->

        <!--@include partials/page-base-swap-bot/bsb-step3-run-log.html-->

      </div><!-- /bsb-container -->

      <!-- ── BSB Wallet Picker Drawer (right-side) ── -->
      <div id="bsb-wallet-picker-overlay" style="display:none;position:fixed;top:0;left:0;right:0;bottom:calc(var(--nav-height) + env(safe-area-inset-bottom, 0px));z-index:9300;background:rgba(5,5,8,0);backdrop-filter:blur(0px);transition:background .25s ease,backdrop-filter .25s ease;" onclick="if(event.target===this)bsbCloseWalletPicker()">
        <div id="bsb-wallet-picker-drawer" style="position:absolute;top:0;right:0;width:78%;max-width:320px;height:100%;background:var(--bg-deep);border-left:1px solid var(--border-subtle);display:flex;flex-direction:column;transform:translateX(100%);transition:transform 0.38s cubic-bezier(0.22,1,0.36,1);overflow:hidden;box-shadow:-8px 0 40px rgba(0,0,0,0.5);">
          <!-- Header -->
          <div style="display:flex;align-items:center;gap:12px;padding:18px 16px 14px;flex-shrink:0;border-bottom:1px solid var(--border-subtle);">
            <div style="width:36px;height:36px;border-radius:12px;background:rgba(59,130,246,0.12);border:1px solid rgba(59,130,246,0.25);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
              <span class="material-icons-round" style="font-size:18px;color:#3b82f6;">account_balance_wallet</span>
            </div>
            <div style="flex:1;min-width:0;">
              <div style="font-family:var(--font-display);font-size:15px;font-weight:800;color:var(--text-primary);">Wallet Groups</div>
              <div style="font-family:var(--font-mono);font-size:9px;color:var(--text-muted);letter-spacing:.5px;margin-top:1px;">Select → Keys load হবে</div>
            </div>
            <button onclick="bsbCloseWalletPicker()" style="width:32px;height:32px;border-radius:10px;border:1px solid var(--border-subtle);background:var(--bg-raised);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .15s;" onmousedown="this.style.background='var(--bg-glass-hover)'" onmouseup="this.style.background='var(--bg-raised)'" ontouchstart="this.style.background='var(--bg-glass-hover)'" ontouchend="this.style.background='var(--bg-raised)'">
              <span class="material-icons-round" style="font-size:16px;color:var(--text-muted);">close</span>
            </button>
          </div>
          <!-- Select All Row -->
          <div style="padding:10px 14px;flex-shrink:0;border-bottom:1px solid var(--border-subtle);">
            <button onclick="bsbWalletPickerSelectAll()" style="width:100%;padding:8px 12px;border-radius:9px;font-family:var(--font-mono);font-size:10px;font-weight:700;cursor:pointer;border:1px solid rgba(59,130,246,0.3);background:rgba(59,130,246,0.08);color:#3b82f6;transition:all .15s;letter-spacing:.5px;" onmousedown="this.style.background='rgba(59,130,246,0.18)'" onmouseup="this.style.background='rgba(59,130,246,0.08)'" ontouchstart="this.style.background='rgba(59,130,246,0.18)'" ontouchend="this.style.background='rgba(59,130,246,0.08)'">☑ Select All</button>
          </div>
          <!-- Group List (scrollable) -->
          <div id="bsb-wallet-picker-list" style="flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px;scrollbar-width:none;"></div>
          <!-- Apply Button -->
          <div style="padding:12px 14px 20px;flex-shrink:0;border-top:1px solid var(--border-subtle);">
            <button onclick="bsbApplyWalletPicker()" style="width:100%;padding:14px;border-radius:12px;font-family:var(--font-mono);font-size:12px;font-weight:700;cursor:pointer;border:none;background:linear-gradient(145deg,#3b82f6,#8b5cf6);color:#fff;box-shadow:0 4px 20px rgba(59,130,246,.35);transition:all .15s;" onmousedown="this.style.opacity='.8'" onmouseup="this.style.opacity='1'" ontouchstart="this.style.opacity='.8'" ontouchend="this.style.opacity='1'">
              ✓ Load Selected Keys
            </button>
          </div>
        </div>
      </div>

    </div><!-- /page-base-swap-bot -->
