<div id="page-nansen" class="page" style="display:flex;flex-direction:column;overflow:hidden;padding-bottom:0;">
  <div id="swap-modal-inner"
    style="width: 100%; max-width: 100%; margin: 0 auto;height:100%;display:flex;flex-direction:column;">
    <!-- Modal header bar -->
    <div style="display:flex;align-items:center;gap:12px;padding:14px 18px 10px;flex-shrink:0;
      background:var(--bg-deep);border-bottom:1px solid var(--border-subtle);">
      <div onclick="switchPage('profile')" style="width:36px;height:36px;border-radius:12px;
        background:var(--bg-glass);border:1px solid var(--border-subtle);
        display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all 0.2s;"
        onmousedown="this.style.opacity='0.6'" onmouseup="this.style.opacity='1'"
        ontouchstart="this.style.opacity='0.6'" ontouchend="this.style.opacity='1'">
        <span class="material-icons-round" style="font-size:20px;color:var(--text-secondary);">arrow_back</span>
      </div>
      <div style="flex:1;">
        <div style="font-size:13px;font-weight:600;color:var(--text-primary);">Nansen &amp; Jumper Swap</div>
        <div style="font-size:9px;font-family:var(--font-mono);color:var(--accent-primary);letter-spacing:2px;margin-top:1px;">MULTI-WALLET</div>
      </div>
    </div>
    <!-- Scrollable swap content -->
    <div style="flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;background:var(--bg-deep);">
      <div class="swap-container">

        <!-- Header -->
        <div class="swap-header-row">
          <div style="display:flex;gap:8px;align-items:center;">
            <div class="network-badge"><div class="network-dot"></div>BASE</div>
            <div class="settings-btn" onclick="swOpenSettings()">
              <span class="material-icons-round">tune</span>
            </div>
          </div>
        </div>

        <!-- ── STEP INDICATOR ── -->
        <div class="step-bar">
          <div class="step-item active" id="step-1" onclick="goToStep1()" style="cursor:pointer;">
            <div class="step-circle">1</div>
            <div class="step-label">KEYS</div>
          </div>
          <div class="step-line" id="line-1-2"></div>
          <div class="step-item" id="step-2" onclick="goToStep2()" style="cursor:pointer;">
            <div class="step-circle">2</div>
            <div class="step-label">PAIR</div>
          </div>
          <div class="step-line" id="line-2-3"></div>
          <div class="step-item" id="step-3" onclick="goToStep3()" style="cursor:pointer;">
            <div class="step-circle">3</div>
            <div class="step-label">CONFIG</div>
          </div>
          <div class="step-line" id="line-3-4"></div>
          <div class="step-item" id="step-4" onclick="goToStep4()" style="cursor:pointer;">
            <div class="step-circle">4</div>
            <div class="step-label">RUN</div>
          </div>
        </div>

        <!--@include partials/page-nansen/step-1-key-input.html-->

        <!--@include partials/page-nansen/step-2-pair.html-->

        <!--@include partials/page-nansen/step-3-config.html-->

        <!--@include partials/page-nansen/step-4-run.html-->

      </div><!-- /swap-container -->
      <div class="scroll-pad" style="height:calc(var(--nav-height) + 20px);"></div>
    </div>
  </div>
</div>
