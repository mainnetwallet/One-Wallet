        <!-- STEP 2: Keys & Settings -->
        <div class="bsb-panel" id="bsb-step2" style="display:flex;">
          <div class="bsb-body">

          <div class="bsb-card bsb-keys-card">
            <div class="bsb-ch"><div class="bsb-ci"><span class="material-icons-round">vpn_key</span></div><div class="bsb-ct">Private keys</div><div class="bsb-cs" style="margin-left:auto;font-family:var(--font-mono);">One per line (0x...)</div></div>
            <div class="bsb-btn-row">
              <!-- Wallet Panel Picker Button -->
              <button class="bsb-btn-dash" onclick="bsbOpenWalletPicker()"><span class="material-icons-round">account_balance_wallet</span>Select wallet</button>
              <button class="bsb-btn-tonal" onclick="bsbLoadKeys()"><span class="material-icons-round">folder_open</span>Load keys</button>
            </div>
            <div class="bsb-sk-wrapper" id="bsbKeysWrapper">
              <textarea id="bsb-keys" placeholder="0xabc...&#10;0xdef..." class="bsb-sk-textarea sk-masked" autocomplete="off" spellcheck="false"></textarea>
              <button type="button" class="bsb-sk-toggle-btn" id="bsbKeysToggleBtn" onclick="bsbToggleKeyVisibility()" title="Show/Hide Keys">
                <span class="material-icons-round bsb-sk-eye-icon" id="bsbKeysEyeIcon">visibility_off</span>
              </button>
            </div>
            <div id="bsb-keyList" class="bsb-keylist"></div>
          </div>

          <div class="bsb-sec"><div class="bsb-ct">Bot settings</div><div class="bsb-cs">Random within range</div></div>
          <div class="bsb-g2">
            <div class="bsb-tl"><div class="bsb-tl-l">Swaps per key</div><div class="bsb-mm"><input id="bsb-swMin" type="number" value="20" placeholder="min"/><span>–</span><input id="bsb-swMax" type="number" value="30" placeholder="max"/></div></div>
            <div class="bsb-tl"><div class="bsb-tl-l">Amount per txn</div><div class="bsb-mm"><input id="bsb-amMin" type="number" value="1000" placeholder="min"/><span>–</span><input id="bsb-amMax" type="number" value="5000" placeholder="max"/></div></div>
            <div class="bsb-tl"><div class="bsb-tl-l">Liquidity %</div><div class="bsb-mm"><input id="bsb-lqMin" type="number" value="5" placeholder="min"/><span>–</span><input id="bsb-lqMax" type="number" value="10" placeholder="max"/></div></div>
            <div class="bsb-tl"><div class="bsb-tl-l">Delay (ms)</div><div class="bsb-mm"><input id="bsb-dlMin" type="number" value="2000" placeholder="min"/><span>–</span><input id="bsb-dlMax" type="number" value="5000" placeholder="max"/></div></div>
          </div>

          <div class="bsb-tl">
            <div class="bsb-tl-l">Swap slippage</div>
            <div class="bsb-slips">
              <div id="bsb-slip-01" class="bsb-slip" onclick="bsbSelectSlip(0.1)">0.1%</div>
              <div id="bsb-slip-05" class="bsb-slip" onclick="bsbSelectSlip(0.5)">0.5%</div>
              <div id="bsb-slip-10" class="bsb-slip" onclick="bsbSelectSlip(1.0)">1.0%</div>
              <div id="bsb-slip-30" class="bsb-slip" onclick="bsbSelectSlip(3.0)">3.0%</div>
              <div id="bsb-slip-15" class="bsb-slip" onclick="bsbSelectSlip(15)" style="background:var(--accent-primary);color:#fff;border-color:var(--accent-primary);">15%</div>
              <input id="bsb-slip-custom" class="bsb-slip-custom" type="number" placeholder="Custom" min="0.01" max="50" step="0.1" oninput="bsbSelectSlipCustom(this.value)"/>
            </div>
            <input type="hidden" id="bsb-slip-val" value="15"/>
          </div>

          </div>
          <div class="bsb-foot">
            <!-- Go to Run button -->
            <button class="bsb-cta" onclick="bsbGoStep(3)"><span class="material-icons-round">play_arrow</span>Go to run</button>
          </div>

        </div><!-- /bsb-step2 -->
