        <!-- STEP 3: Run & Log -->
        <div class="bsb-panel" id="bsb-step3" style="display:none;">
          <div class="bsb-body bsb-body-run">

          <!-- Stats strip -->
          <div class="bsb-stats">
            <div><span id="bsb-sKeys" class="bsb-sv" style="color:#3b82f6;">0</span><span class="bsb-sl">Keys</span></div>
            <div><span id="bsb-sTxns" class="bsb-sv" style="color:#3b82f6;">0</span><span class="bsb-sl">UserOps</span></div>
            <div><span id="bsb-sSwaps" class="bsb-sv" style="color:#3b82f6;">0</span><span class="bsb-sl">Swaps</span></div>
            <div><span id="bsb-sErr" class="bsb-sv" style="color:#f43f5e;">0</span><span class="bsb-sl">Errors</span></div>
          </div>

          <!-- Log -->
          <div class="bsb-card bsb-logcard">
            <div class="bsb-ch"><div class="bsb-ci"><span class="material-icons-round">terminal</span></div><div class="bsb-ct">Live log</div>
              <button class="bsb-clear" onclick="document.getElementById('bsb-logBox').innerHTML=''"><span class="material-icons-round">delete_outline</span>Clear</button>
            </div>
            <div id="bsb-logBox" class="bsb-logbox"></div>
          </div>

          </div>
          <div class="bsb-foot">
            <!-- Back / Start / Stop -->
            <button class="bsb-ib" onclick="bsbGoStep(2)" aria-label="Back"><span class="material-icons-round">arrow_back</span></button>
            <button id="bsb-startBtn" class="bsb-cta" onclick="bsbStartBot()" disabled style="opacity:0.4;"><span class="material-icons-round">play_arrow</span>Start bot</button>
            <button id="bsb-stopBtn" class="bsb-cta bsb-stop" onclick="bsbStopBot()" style="display:none;"><span class="material-icons-round">stop</span>Stop</button>
          </div>

        </div><!-- /bsb-step3 -->
