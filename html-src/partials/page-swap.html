              </div>
              <!-- Tick marks -->

              </div>
              <!-- Actual range input (invisible but interactive) -->
              <input id="sw-pct-range" type="range" min="1" max="100" value="0" step="1"
                oninput="swSetPercent(this.value)"
                ontouchstart="(function(el,e){window._swSD=true;window._swSX=e.touches[0].clientX;window._swSY=e.touches[0].clientY;window._swAxis=null;el.style.cursor='grabbing';})(this,event)"
                ontouchmove="(function(el,e){if(!window._swSD)return;var cx=e.touches[0].clientX,cy=e.touches[0].clientY;var dx=Math.abs(cx-window._swSX),dy=Math.abs(cy-window._swSY);if(!window._swAxis&&(dx>4||dy>4)){window._swAxis=dx>=dy?'h':'v';}if(window._swAxis==='h'){e.stopPropagation();var rect=el.getBoundingClientRect();var pct=Math.max(1,Math.min(100,Math.round((cx-rect.left)/rect.width*100)));el.value=pct;swSetPercent(pct);}else if(window._swAxis==='v'){el.blur();}})(this,event)"
                ontouchend="(function(el,e){var ax=window._swAxis;window._swSD=false;window._swAxis=null;el.style.cursor='grab';if(ax==='h'){var rect=el.getBoundingClientRect();var tx=e.changedTouches[0].clientX;var pct=Math.max(1,Math.min(100,Math.round((tx-rect.left)/rect.width*100)));el.value=pct;swSetPercent(pct);}else if(ax==='v'){el.value=el.value;}})(this,event)"
                style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:grab;z-index:10;margin:0;padding:0;-webkit-appearance:none;appearance:none;touch-action:none;">
              <!-- Thumb indicator -->

            </div><!-- /slider inner -->

                <span style="font-family:var(--font-mono);font-size:9px;font-weight:800;color:var(--accent-primary);letter-spacing:1.2px;pointer-events:none;">MAX</span>
              </div>
            </div><!-- /slider+max row -->
          </div>
