      <!-- ╔══════ TH UNIVERSAL WALLET PICKER DRAWER ══════╗ -->
      <div id="th-wallet-picker-overlay" style="display:none;position:fixed;top:0;left:0;right:0;bottom:calc(var(--nav-height) + env(safe-area-inset-bottom, 0px));z-index:9500;background:rgba(5,5,8,0);backdrop-filter:blur(0px);transition:background .25s ease,backdrop-filter .25s ease;" onclick="if(event.target===this)thCloseWalletPicker()">
        <div id="th-wallet-picker-drawer" style="position:fixed;top:0;right:0;width:78%;max-width:320px;height:100%;background:var(--bg-deep);border-left:1px solid var(--border-subtle);display:flex;flex-direction:column;transform:translateX(100%);transition:transform 0.38s cubic-bezier(0.22,1,0.36,1);overflow:hidden;box-shadow:-8px 0 40px rgba(0,0,0,0.5);z-index:9501;">
          <!-- Header -->
          <div style="display:flex;align-items:center;gap:12px;padding:18px 16px 14px;flex-shrink:0;border-bottom:1px solid var(--border-subtle);">
            <div id="th-picker-icon-wrap" style="width:36px;height:36px;border-radius:12px;background:rgba(99,102,241,0.12);border:1px solid rgba(99,102,241,0.25);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
              <span class="material-icons-round" style="font-size:18px;color:var(--accent-primary);">account_balance_wallet</span>
            </div>
            <div style="flex:1;min-width:0;">
              <div style="font-family:var(--font-display);font-size:15px;font-weight:800;color:var(--text-primary);">Wallet Groups</div>
              <div id="th-picker-subtitle" style="font-family:var(--font-mono);font-size:9px;color:var(--text-muted);letter-spacing:.5px;margin-top:1px;">Select করুন → Field-এ load হবে</div>
            </div>
            <button onclick="thCloseWalletPicker()" style="width:32px;height:32px;border-radius:10px;border:1px solid var(--border-subtle);background:var(--bg-raised);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .15s;" onmousedown="this.style.background='var(--bg-glass-hover)'" onmouseup="this.style.background='var(--bg-raised)'" ontouchstart="this.style.background='var(--bg-glass-hover)'" ontouchend="this.style.background='var(--bg-raised)'">
              <span class="material-icons-round" style="font-size:16px;color:var(--text-muted);">close</span>

          </div>
          <!-- Mode Badge + Select All Row -->
          <div style="padding:10px 14px;flex-shrink:0;border-bottom:1px solid var(--border-subtle);display:flex;gap:8px;align-items:center;">
            <div id="th-picker-mode-badge" style="padding:3px 10px;border-radius:6px;font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:.8px;flex-shrink:0;background:rgba(99,102,241,.12);border:1px solid rgba(99,102,241,.3);color:var(--accent-primary);">SINGLE KEY</div>
            <button onclick="thPickerSelectAll()" style="flex:1;padding:7px 10px;border-radius:9px;font-family:var(--font-mono);font-size:10px;font-weight:700;cursor:pointer;border:1px solid rgba(99,102,241,0.3);background:rgba(99,102,241,0.07);color:var(--accent-primary);transition:all .15s;letter-spacing:.5px;" onmousedown="this.style.background='rgba(99,102,241,0.18)'" onmouseup="this.style.background='rgba(99,102,241,0.07)'" ontouchstart="this.style.background='rgba(99,102,241,0.18)'" ontouchend="this.style.background='rgba(99,102,241,0.07)'">☑ Select All</button>
          </div>
          <!-- Group List (scrollable) -->
          <div id="th-wallet-picker-list" style="flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px;scrollbar-width:none;-webkit-overflow-scrolling:touch;"></div>
          <!-- Apply Button -->
          <div style="padding:12px 14px 20px;flex-shrink:0;border-top:1px solid var(--border-subtle);">
            <button onclick="thApplyWalletPicker()" id="th-picker-apply-btn" style="width:100%;padding:14px;border-radius:12px;font-family:var(--font-mono);font-size:12px;font-weight:700;cursor:pointer;border:none;background:linear-gradient(145deg,var(--accent-primary),var(--accent-secondary));color:#fff;box-shadow:0 4px 20px rgba(99,102,241,.35);transition:all .15s;" onmousedown="this.style.opacity='.8'" onmouseup="this.style.opacity='1'" ontouchstart="this.style.opacity='.8'" ontouchend="this.style.opacity='1'">
              ✓ Load Selected Keys
            </button>
          </div>
        </div>
      </div>
