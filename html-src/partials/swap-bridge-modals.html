    <!-- Token Picker -->
    <div id="sw-token-modal" style="position:fixed;top:0;left:0;right:0;bottom:calc(var(--nav-height) + env(safe-area-inset-bottom, 0px));z-index:9000;background:rgba(0,0,0,0.6);align-items:flex-end;justify-content:center;" onclick="if(event.target===this)swCloseTokenPicker()">

        <div class="sw-tp-grab"><div class="sw-tp-handle"></div></div>
        <div class="sw-tp-head">
          <div class="sw-tp-title">Select token</div>
          <button type="button" class="sw-tp-close" onclick="swCloseTokenPicker()" aria-label="Close"><span class="material-icons-round">close</span></button>
        </div>
        <!-- Search -->
        <div class="sw-tp-search">
          <span class="material-icons-round sw-tp-search-ico">search</span>
          <input id="sw-token-search" type="text" placeholder="Search name, symbol or paste 0x…" autocomplete="off" autocapitalize="none" spellcheck="false" oninput="swFilterTokens(this.value)">
          <button type="button" class="sw-tp-paste" onclick="swPasteTokenSearch()">Paste</button>
        </div>
        <!-- Contract address status -->
        <div id="sw-contract-status" style="display:none;font-family:var(--font-mono);font-size:10px;color:var(--text-muted);margin-bottom:8px;padding:0 2px;"></div>
        <!-- Contract preview card -->
        <div id="sw-contract-preview" style="display:none;margin-bottom:10px;padding:12px 14px;border-radius:12px;background:rgba(99,102,241,0.07);border:1px solid rgba(99,102,241,0.25);cursor:pointer;" onclick="swSelectContractToken()">
          <div style="display:flex;align-items:center;gap:10px;">
            <div id="sw-contract-icon" style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;flex-shrink:0;">?</div>
            <div style="flex:1;min-width:0;">
              <div id="sw-contract-sym" style="font-size:13px;font-weight:800;color:var(--text-primary);">—</div>
              <div id="sw-contract-name" style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">—</div>
            </div>
            <div style="font-family:var(--font-mono);font-size:9px;color:var(--neon-cyan);background:rgba(34,211,238,0.08);border:1px solid rgba(34,211,238,0.2);border-radius:6px;padding:3px 7px;">TAP TO SELECT</div>
          </div>
        </div>
        <div id="sw-tp-label" class="sw-tp-label">All tokens</div>
        <!-- Token list -->
        <div id="sw-token-list" class="sw-tp-list"></div>
      </div>
    </div>
