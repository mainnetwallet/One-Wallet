        <!-- ╔══════ BRIDGE PAGE — LiFi Powered (redesign) ══════╗ -->
    <div class="page" id="page-bridge">
      <link rel="stylesheet" href="styles/features/bridge/bridge-inputs.css">
      <link rel="stylesheet" href="styles/features/bridge/bridge-slider.css">
      <link rel="stylesheet" href="styles/features/bridge/bridge-page.css">

      <!-- Header -->
      <div class="br-head">
        <div class="br-logo"><span class="material-icons-round">alt_route</span></div>
        <div class="br-title">Bridge</div>
        <div id="br-connect-btn" class="br-wallet-pill" onclick="brOpenWalletPanel()">
          <span class="br-avatar"><span class="material-icons-round" id="br-connect-icon">account_balance_wallet</span></span>
          <div class="br-wallet-txt">
            <span id="br-connect-label">Connect</span>
            <span id="br-connect-addr"></span>
          </div>
        </div>
        <div class="br-circle-btn" aria-label="History" onclick="brToggleHistDropdown()" ontouchend="event.preventDefault();brToggleHistDropdown();">
          <span class="material-icons-round">history</span>
          <span id="br-hist-pending-dot" class="br-pending-dot"></span>
        </div>
        <div class="br-circle-btn" aria-label="Settings" onclick="brOpenSettings()">
          <span class="material-icons-round">tune</span>
        </div>
      </div>

      <div id="br-static-area">

        <!-- hidden element for JS compatibility -->
        <div id="br-sender-addr" style="display:none;"></div>

        <!-- ══ YOU SEND ══ -->
        <div class="br-card">
          <div id="br-from-balance-row" class="br-card-head">
            <span class="br-lbl">You send</span>
            <span class="br-bal">
              <span class="material-icons-round br-bal-ico">account_balance_wallet</span>
              <span id="br-from-balance-val" onclick="brForceRefreshBalance()" title="Tap to refresh via RPC">—&nbsp;<span class="material-icons-round">refresh</span></span>
            </span>
            <!-- Hidden legacy elements for JS compatibility -->
            <span id="br-bal-status-icon" style="display:none;"></span>
            <div id="br-bal-max-btn" style="display:none;"></div>
          </div>

          <div class="br-tok-line">
            <div class="br-tok">
              <div class="br-tok-ico" onclick="brOpenTokenPicker('from')">
                <div id="br-from-token-icon" class="br-ti"><span class="br-ti-fb">E</span></div>
                <div id="br-from-chain-emoji" class="br-badge">🔵</div>
              </div>
              <div class="br-tok-txt">
                <div id="br-from-token-btn" class="br-sym" onclick="brOpenTokenPicker('from')">
                  <span id="br-from-token-sym">ETH</span><span class="material-icons-round">expand_more</span>
                </div>
                <div id="br-from-chain-btn" class="br-on" onclick="brOpenChainPicker('from')">on <span id="br-from-chain-name">Base</span></div>
              </div>
            </div>
            <div class="br-amt-col">
              <input id="br-from-amount" class="br-amt" type="number" inputmode="decimal" placeholder="0" oninput="brOnAmountChange()">
              <div id="br-from-usd" class="br-usd">≈ $0.00</div>
            </div>
          </div>

          <!-- Quick amount chips -->
          <div id="br-pct-row" class="br-pct-row">
            <button type="button" class="br-pct" onclick="brSetPct(25)">25%</button>
            <button type="button" class="br-pct" onclick="brSetPct(50)">50%</button>
            <button type="button" class="br-pct" onclick="brSetPct(75)">75%</button>
            <button type="button" id="br-pct-100" class="br-pct br-pct-max" onclick="brSetPct(100)">Max</button>
          </div>

          <!-- Legacy slider kept in DOM (hidden) so existing JS keeps working -->
          <div style="display:none;">
            <span id="br-pct-label">0%</span>
            <div id="br-slider-track-bg"></div>
            <div id="br-slider-track-fill"></div>
            <input id="br-pct-slider" type="range" min="0" max="100" value="0" oninput="brOnSliderInput(this.value)">
          </div>
        </div>

        <!-- Flip -->
        <div class="br-flip-wrap">
          <div id="br-flip-btn" class="br-flip" aria-label="Flip chains" onclick="brFlipChains()">
            <span class="material-icons-round">swap_vert</span>
          </div>
        </div>

        <!-- ══ YOU RECEIVE ══ -->
        <div class="br-card">
          <div class="br-card-head"><span class="br-lbl">You receive</span></div>

          <div class="br-tok-line">
            <div class="br-tok">
              <div class="br-tok-ico" onclick="brOpenTokenPicker('to')">
                <div id="br-to-token-icon" class="br-ti"><span class="br-ti-fb">E</span></div>
                <div id="br-to-chain-emoji" class="br-badge">🔷</div>
              </div>
              <div class="br-tok-txt">
                <div id="br-to-token-btn" class="br-sym" onclick="brOpenTokenPicker('to')">
                  <span id="br-to-token-sym">ETH</span><span class="material-icons-round">expand_more</span>
                </div>
                <div id="br-to-chain-btn" class="br-on" onclick="brOpenChainPicker('to')">on <span id="br-to-chain-name">Ethereum</span></div>
              </div>
            </div>
            <div class="br-amt-col">
              <div id="br-to-amount" class="br-amt br-amt-out">—</div>
              <div id="br-to-usd" class="br-usd">≈ $0.00</div>
            </div>
          </div>

          <!-- Legacy TO balance row (hidden) -->
          <div id="br-to-balance-row"><span id="br-to-balance-val">—</span></div>

          <!-- Recipient -->
          <div id="br-recipient-row" class="br-recip">
            <span class="material-icons-round br-recip-ico">send</span>
            <div class="br-recip-field">
              <input id="br-recipient" placeholder="To your wallet"
                autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
                inputmode="none" readonly
                onfocus="this.blur();"
                onblur="document.getElementById('br-recipient-row').style.borderColor=''; brUpdateRecipientDisplay(false);">
              <div id="br-recipient-display">
                <span id="br-recipient-display-text">To your wallet</span>
              </div>
            </div>
            <div id="br-recipient-clear" onclick="brClearRecipient()" title="Clear recipient">
              <span class="material-icons-round">close</span>
            </div>
            <div class="br-recip-change" onclick="brOpenRecipientPanel()">Change</div>
          </div>
        </div>

      </div><!-- /br-static-area -->

      <!-- Routes label — shown when routes loaded -->
      <div id="br-routes-found-label" class="br-routes-label">
        <div id="br-routes-found-text">0 routes</div>
      </div>

      <!-- Scrollable routes area -->
      <div id="br-routes-scroll-area">
        <div id="br-quote-loading" class="br-quote-loading">
          <div class="br-spinner"></div>
          <div>Finding best routes…</div>
        </div>

        <!-- Error -->
        <div id="br-quote-error" class="br-quote-error"></div>

        <!-- GET QUOTE button — hidden, auto-quote triggers on amount input -->
        <button id="br-quote-btn" onclick="brFetchRoutes()" style="display:none;"></button>

        <!-- Routes list — multiple selectable routes -->
        <div id="br-routes-list" style="display:none;width:100%;"></div>
      </div><!-- /br-routes-scroll-area -->

      <!-- Review button — pinned above the bottom nav -->
      <div id="br-exec-wrap">
        <button id="br-exec-btn" onclick="brOpenConfirm()">
          <span id="br-exec-spin"></span>
          <span id="br-exec-label">Review bridge</span>
          <span class="material-icons-round" id="br-exec-icon">arrow_forward</span>
        </button>
      </div>
    </div>
