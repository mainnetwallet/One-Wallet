<!-- GROUP PICKER MODAL -->
<div id="hw-group-overlay" style="position:fixed;top:0;left:0;right:0;bottom:calc(var(--nav-height) + env(safe-area-inset-bottom, 0px));z-index:1200;background:rgba(0,0,0,0.55);opacity:0;will-change:opacity;pointer-events:none;transition:opacity 0.25s ease;display:flex;align-items:stretch;justify-content:flex-end;">
  <div id="hw-group-modal" style="width:82%;max-width:320px;height:100%;background:var(--bg-surface);border-radius:var(--radius-xl) 0 0 var(--radius-xl);border:1px solid var(--border-subtle);border-right:none;padding:56px 16px 40px 16px;transform:translateX(100%);transition:transform 0.32s cubic-bezier(0.34,1.2,0.64,1);overflow:hidden;display:flex;flex-direction:column;">
    <!-- drag handle — now vertical pill on the left edge -->
    <div style="position:absolute;left:8px;top:50%;transform:translateY(-50%);width:4px;height:40px;background:rgba(255,255,255,0.15);border-radius:2px;"></div>
    <div style="font-size:11px;font-weight:700;font-family:var(--font-mono);color:var(--text-muted);letter-spacing:2px;margin-bottom:16px;flex-shrink:0;">SELECT GROUP</div>
    <div id="hw-group-list" style="flex:1;overflow-y:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;"></div>
  </div>
</div>
