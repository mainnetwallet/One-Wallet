<!-- ══ SEND CONFIRM BOTTOM SHEET ══ -->
<div id="send-confirm-overlay" style="
  position:fixed;inset:0;z-index:9999;
  background:rgba(0,0,0,0);
  backdrop-filter:blur(0px);
  -webkit-backdrop-filter:blur(0px);
  transition:background 0.3s ease, backdrop-filter 0.3s ease;
  pointer-events:none;
" onclick="closeSendConfirmSheet()"></div>

<div id="send-confirm-sheet" style="
  position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(110%);
  width:100%;max-width: 100%;
  background:var(--bg-surface);
  border-top:1px solid var(--border-subtle);
  border-radius:28px 28px 0 0;
  padding:0 0 calc(env(safe-area-inset-bottom) + 24px);
  z-index:10000;
  transition:transform 0.42s cubic-bezier(0.34,1.2,0.64,1);
  box-shadow:0 -8px 48px rgba(0,0,0,0.55), 0 -2px 12px rgba(0,0,0,0.3);
">
  <!-- Drag handle -->
  <div style="display:flex;justify-content:center;padding:12px 0 4px;">
    <div style="width:36px;height:4px;border-radius:2px;background:var(--border-subtle);"></div>
  </div>

  <!-- Header -->
  <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 20px 16px;">
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="width:36px;height:36px;border-radius:12px;background:rgba(245,158,11,0.12);border:1px solid rgba(245,158,11,0.28);display:flex;align-items:center;justify-content:center;">
        <span class="material-icons-round" style="font-size:18px;color:#f59e0b;">send</span>
      </div>
      <div>
        <div style="font-family:var(--font-display);font-size:15px;font-weight:700;color:var(--text-primary);letter-spacing:0.3px;">Confirm Transaction</div>
        <div style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted);margin-top:1px;">Review before sending</div>
      </div>
    </div>
    <button onclick="closeSendConfirmSheet()" style="width:32px;height:32px;border-radius:50%;background:var(--bg-glass);border:1px solid var(--border-subtle);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-secondary);">
      <span class="material-icons-round" style="font-size:16px;">close</span>
    </button>
  </div>

  <!-- Divider -->
  <div style="height:1px;background:var(--border-subtle);margin:0 20px 18px;"></div>

  <!-- Confirm Details Card -->
  <div style="margin:0 16px;background:var(--bg-raised);border:1px solid var(--border-subtle);border-radius:20px;overflow:hidden;">
    <!-- Amount hero -->
    <div style="padding:20px;text-align:center;border-bottom:1px solid var(--border-subtle);background:linear-gradient(135deg,rgba(245,158,11,0.07),rgba(217,119,6,0.04));">
      <div style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted);letter-spacing:1.5px;margin-bottom:6px;">SENDING</div>
      <div id="csheet-amount" style="font-family:var(--font-display);font-size:28px;font-weight:800;color:var(--text-primary);line-height:1.1;">—</div>
      <div id="csheet-usd" style="font-family:var(--font-mono);font-size:12px;color:var(--text-muted);margin-top:4px;">≈ $0.00</div>
    </div>

    <!-- Details rows -->
    <div style="padding:14px 16px;display:flex;flex-direction:column;gap:12px;">
      <!-- From -->
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;">
        <span style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted);letter-spacing:1px;min-width:60px;padding-top:1px;">FROM</span>
        <span id="csheet-from" style="font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);text-align:right;word-break:break-all;">—</span>
      </div>
      <!-- To -->
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;">
        <span style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted);letter-spacing:1px;min-width:60px;padding-top:1px;">TO</span>
        <span id="csheet-to" style="font-family:var(--font-mono);font-size:11px;color:var(--neon-cyan);text-align:right;word-break:break-all;">—</span>
      </div>
      <!-- Network -->
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
        <span style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted);letter-spacing:1px;min-width:60px;">NETWORK</span>
        <span id="csheet-network" style="font-family:var(--font-mono);font-size:11px;color:var(--accent-green);text-align:right;">—</span>
      </div>
      <!-- Gas -->
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
        <span style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted);letter-spacing:1px;min-width:60px;">GAS FEE</span>
        <span id="csheet-gas" style="font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);text-align:right;">Estimating…</span>
      </div>
    </div>
  </div>



  <!-- Confirm button -->
  <div style="padding:16px 16px 0;">
    <button id="confirm-send-btn" onclick="confirmAndSend()" style="
      width:100%;padding:16px;
      background:linear-gradient(135deg,#f59e0b,#d97706);
      border:none;border-radius:var(--radius-md);
      font-family:var(--font-display);font-size:14px;font-weight:700;
      color:#fff;letter-spacing:0.5px;cursor:pointer;
      transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);
      box-shadow:0 0 24px rgba(245,158,11,0.35),0 4px 16px rgba(0,0,0,0.4);
      display:flex;align-items:center;justify-content:center;gap:8px;
    ">
      <span class="material-icons-round" style="font-size:18px;">rocket_launch</span>
      CONFIRM &amp; SEND
    </button>


    <!-- Cancel -->
    <button onclick="closeSendConfirmSheet()" style="
      width:100%;padding:12px;margin-top:8px;
      background:transparent;border:1px solid var(--border-subtle);border-radius:var(--radius-md);
      font-family:var(--font-display);font-size:13px;font-weight:600;
      color:var(--text-muted);cursor:pointer;letter-spacing:0.3px;
      transition:all 0.2s ease;
    ">
      Cancel
    </button>
  </div>
</div>
