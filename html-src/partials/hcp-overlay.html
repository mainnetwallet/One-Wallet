<div class="hcp-overlay" id="hcp-overlay" onclick="hcpOverlayClick(event)" style="z-index:900;">
  <div class="hcp-modal" id="hcp-modal">
    <!-- Handle -->
    <div style="display:flex;justify-content:center;padding:10px 0 0;">
      <div style="width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,0.12);"></div>
    </div>
    <!-- Header -->
    <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 20px 10px;flex-shrink:0;">
      <div>
        <div style="font-size:20px;font-weight:700;">Select network</div>
        <div style="font-size:12px;color:var(--text-muted);margin-top:2px;">Filter tokens by chain</div>
      </div>
      <div onclick="closeHomeChainPicker()" style="width:34px;height:34px;border-radius:10px;background:var(--bg-glass);border:1px solid var(--border-subtle);display:flex;align-items:center;justify-content:center;cursor:pointer;" onmousedown="this.style.transform='scale(0.9)'" onmouseup="this.style.transform=''" ontouchstart="this.style.transform='scale(0.9)'" ontouchend="this.style.transform=''">
        <span class="material-icons-round" style="font-size:17px;color:var(--text-secondary)">close</span>
      </div>
    </div>
    <!-- Tab Bar -->
    <div class="hcp-seg">
      <button id="hcp-tab-my" class="on" onclick="hcpSwitchTab('my')">My networks<span class="hcp-seg-n" id="hcp-my-count"></span></button>
      <button id="hcp-tab-cl" onclick="hcpSwitchTab('chainlist')">Chainlist</button>
    </div>

    <!-- MY NETWORKS panel -->
    <div id="hcp-panel-my" style="flex:1;display:flex;flex-direction:column;overflow:hidden;">
      <!-- Search for MY NETWORKS -->
      <div class="hcp-searchrow">
        <div class="hcp-search">
          <span class="material-icons-round" style="font-size:18px;color:var(--text-muted);flex-shrink:0;">search</span>
          <input id="hcp-my-search" type="text" placeholder="Name or chain ID, like 8453"
            oninput="hcpMySearch()" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
          <span id="hcp-my-clear" onclick="hcpMyClearSearch()" style="display:none;cursor:pointer;">
            <span class="material-icons-round" style="font-size:16px;color:var(--text-muted);">close</span>
          </span>
        </div>
      </div>
      <div id="hcp-list" style="flex:1;overflow-y:auto;scrollbar-width:none;padding:0 16px 8px;"></div>
    </div>

    <!-- CHAINLIST panel (hidden by default) -->
    <div id="hcp-panel-cl" style="display:none;flex:1;flex-direction:column;overflow:hidden;">
      <!-- Search input + testnet switch -->
      <div style="padding:0 16px 8px;flex-shrink:0;">
        <div class="hcp-searchrow" style="padding:0;" id="hcp-cl-search-wrap">
          <div class="hcp-search">
            <span class="material-icons-round" style="font-size:18px;color:var(--text-muted);flex-shrink:0;">search</span>
            <input id="hcp-cl-search" type="text" placeholder="Name or chain ID, like 8453"
              oninput="hcpClSearch()" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
            <span id="hcp-cl-clear" onclick="hcpClClearSearch()" style="display:none;cursor:pointer;">
              <span class="material-icons-round" style="font-size:16px;color:var(--text-muted);">close</span>
            </span>
          </div>
          <div class="hcp-switch" id="hcp-cl-testnet-btn" role="switch" aria-checked="false" tabindex="0"
            onclick="hcpToggleKoreTestnet(this)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();hcpToggleKoreTestnet(this)}">
            <span>Testnets</span><div class="hcp-sw"><i></i></div>
          </div>
        </div>
        <div id="hcp-cl-status" style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted);padding:8px 2px 0;min-height:16px;display:flex;align-items:center;">
          <span id="hcp-cl-status-text"></span>
        </div>
      </div>
      <!-- Results -->
      <div id="hcp-cl-results" style="flex:1;overflow-y:auto;scrollbar-width:none;padding:0 16px 8px;"></div>
    </div>

    <!-- Add Custom Chain button -->
    <div id="hcp-add-footer" style="display:none;padding:10px 16px 16px;flex-shrink:0;border-top:1px solid var(--border-subtle);">
      <div id="hcp-add-chain-btn" onclick="hcpToggleAddChain()" style="display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--radius-md);background:rgba(99,102,241,0.08);border:1px dashed rgba(99,102,241,0.35);cursor:pointer;transition:all 0.2s;" onmousedown="this.style.opacity='.7'" onmouseup="this.style.opacity='1'" ontouchstart="this.style.opacity='.7'" ontouchend="this.style.opacity='1'">
        <span class="material-icons-round" style="font-size:20px;color:var(--accent-primary);">add_circle_outline</span>
        <div>
          <div style="font-size:12px;font-weight:700;color:var(--text-primary);">Add custom network</div>
          <div style="font-size:10px;color:var(--text-muted);font-family:var(--font-mono);margin-top:1px;">Any EVM network + tokens</div>
        </div>
        <span class="material-icons-round" id="hcp-add-chevron" style="margin-left:auto;font-size:18px;color:var(--text-muted);transition:transform 0.25s;">expand_more</span>
      </div>
      <!-- Custom chain form (hidden by default) -->
      <div id="hcp-add-form" style="display:none;margin-top:10px;background:var(--bg-raised);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:14px;gap:10px;">
        <div style="font-size:9px;font-weight:700;color:var(--text-muted);letter-spacing:1.5px;font-family:var(--font-mono);">CHAIN INFO</div>
        <div style="display:flex;gap:8px;">
          <div style="flex:0 0 52px;">
            <input id="hcp-new-emoji" type="text" placeholder="🔗" maxlength="4"
              style="width:100%;text-align:center;font-size:22px;background:var(--bg-glass);border:1px solid var(--border-subtle);border-radius:10px;padding:8px 4px;outline:none;color:var(--text-primary);">
          </div>
          <input id="hcp-new-name" type="text" placeholder="Chain Name (e.g. Fantom)"
            style="flex:1;background:var(--bg-glass);border:1px solid var(--border-subtle);border-radius:10px;padding:9px 12px;font-family:var(--font-mono);font-size:12px;color:var(--text-primary);outline:none;">
        </div>
        <input id="hcp-new-chainid" type="number" placeholder="Chain ID (e.g. 250)"
          style="width:100%;background:var(--bg-glass);border:1px solid var(--border-subtle);border-radius:10px;padding:9px 12px;font-family:var(--font-mono);font-size:12px;color:var(--text-primary);outline:none;">
        <div style="position:relative;">
          <textarea id="hcp-new-rpc" placeholder="RPC URLs — one per line&#10;https://rpc1.example.com&#10;https://rpc2.example.com&#10;https://rpc3.example.com" rows="4"
            style="width:100%;background:var(--bg-glass);border:1px solid var(--border-subtle);border-radius:10px;padding:9px 12px 9px 12px;font-family:var(--font-mono);font-size:11px;color:var(--text-primary);outline:none;resize:vertical;line-height:1.6;"></textarea>
          <div style="position:absolute;top:7px;right:9px;font-size:9px;font-family:var(--font-mono);color:var(--text-muted);pointer-events:none;background:var(--bg-glass);padding:1px 5px;border-radius:5px;border:1px solid var(--border-subtle);">multi RPC</div>
        </div>
        <input id="hcp-new-explorer" type="text" placeholder="Explorer URL (optional)"
          style="width:100%;background:var(--bg-glass);border:1px solid var(--border-subtle);border-radius:10px;padding:9px 12px;font-family:var(--font-mono);font-size:11px;color:var(--text-primary);outline:none;">
        <div style="font-size:9px;font-weight:700;color:var(--text-muted);letter-spacing:1.5px;font-family:var(--font-mono);margin-top:2px;">NATIVE TOKEN</div>
        <div style="display:flex;gap:8px;">
          <input id="hcp-new-native-sym" type="text" placeholder="SYM (e.g. FTM)" maxlength="8"
            style="flex:1;background:var(--bg-glass);border:1px solid var(--border-subtle);border-radius:10px;padding:9px 12px;font-family:var(--font-mono);font-size:12px;color:var(--text-primary);outline:none;text-transform:uppercase;" oninput="this.value=this.value.toUpperCase()">
          <input id="hcp-new-native-name" type="text" placeholder="Full name (e.g. Fantom)"
            style="flex:2;background:var(--bg-glass);border:1px solid var(--border-subtle);border-radius:10px;padding:9px 12px;font-family:var(--font-mono);font-size:12px;color:var(--text-primary);outline:none;">
        </div>
        <input id="hcp-new-native-cgid" type="text" placeholder="CoinGecko ID (optional, e.g. fantom)"
          style="width:100%;background:var(--bg-glass);border:1px solid var(--border-subtle);border-radius:10px;padding:9px 12px;font-family:var(--font-mono);font-size:11px;color:var(--text-primary);outline:none;">
        <div id="hcp-new-status" style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted);min-height:14px;"></div>
        <button onclick="hcpSaveCustomChain()" style="width:100%;padding:12px;background:linear-gradient(135deg,var(--accent-primary),var(--accent-secondary));border:none;border-radius:var(--radius-md);color:#fff;font-family:var(--font-display);font-size:13px;font-weight:800;letter-spacing:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:var(--glow-primary);">
          <span class="material-icons-round" style="font-size:16px;">add_link</span>
          ADD CHAIN
        </button>
      </div>
    </div>
  </div>
</div>
