    <!-- Console Log Panel (styles: styles/features/home/console-log-panel.css, logic: scripts/features/wallet/app-main/console-log-panel.js) -->
    <div id="nx-console-modal" class="clp">
      <div class="clp-head">
        <button type="button" class="clp-ib" onclick="closeConsoleLogPanel()" aria-label="Back">
          <span class="material-icons-round">arrow_back</span>
        </button>
        <div class="clp-title">
          <div class="clp-h1">Console log</div>
          <div class="clp-sub" id="nx-console-count-sub">0 entries</div>
        </div>
        <button type="button" class="clp-ib" onclick="copyConsoleLogs()" aria-label="Copy logs" title="Copy">
          <span class="material-icons-round">content_copy</span>
        </button>
        <button type="button" class="clp-ib" onclick="clearConsoleLogs()" aria-label="Clear logs" title="Clear">
          <span class="material-icons-round">delete_sweep</span>
        </button>
      </div>

      <div class="clp-cap" id="nx-console-cap" onclick="toggleConsoleLogCapture()">
        <span class="clp-dot" id="nx-console-dot"></span>
        <div class="clp-cap-tx">
          <div class="clp-cap-t" id="nx-console-cap-t">Capture is off</div>
          <div class="clp-cap-s" id="nx-console-cap-s">Nothing is recorded while off</div>
        </div>
        <div class="toggle" id="nx-console-toggle"></div>
      </div>

      <div class="clp-tools">
        <label class="clp-search">
          <span class="material-icons-round">search</span>
          <input id="nx-console-search" type="search" placeholder="Search logs" autocomplete="off" autocapitalize="off" spellcheck="false" oninput="setConsoleLogQuery(this.value)">
          <span class="material-icons-round clp-x" id="nx-console-search-x" onclick="event.preventDefault();setConsoleLogQuery('',true)">close</span>
        </label>
        <div class="clp-chips" id="nx-console-chips"></div>
      </div>

      <div id="nx-console-list" class="clp-list" onclick="consoleLogListTap(event)"></div>
    </div>
