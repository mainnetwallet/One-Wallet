    <!-- Console Log Panel -->
    <div id="nx-console-modal" style="position:fixed;top:0;left:0;right:0;bottom:0;z-index:20000;background:var(--bg-deep);display:none;flex-direction:column;">
      <div style="display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top, 0px)) 16px 14px;border-bottom:1px solid var(--border-subtle);flex-shrink:0;">
        <div onclick="closeConsoleLogPanel()" ontouchend="event.preventDefault();closeConsoleLogPanel();" style="width:36px;height:36px;border-radius:12px;background:var(--bg-glass);border:1px solid var(--border-subtle);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;">
          <span class="material-icons-round" style="font-size:20px;color:var(--text-secondary);">arrow_back</span>
        </div>
        <div style="flex:1;min-width:0;">
          <div style="font-size:14px;font-weight:800;font-family:var(--font-display);">Console Log</div>
          <div id="nx-console-count-sub" style="font-size:9px;font-family:var(--font-mono);color:var(--text-muted);">0 entries</div>
        </div>
        <div onclick="copyConsoleLogs()" ontouchend="event.preventDefault();copyConsoleLogs();" title="Copy all" style="width:36px;height:36px;border-radius:12px;background:var(--bg-glass);border:1px solid var(--border-subtle);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;">
          <span class="material-icons-round" style="font-size:18px;color:var(--text-secondary);">content_copy</span>
        </div>
        <div onclick="clearConsoleLogs()" ontouchend="event.preventDefault();clearConsoleLogs();" title="Clear" style="width:36px;height:36px;border-radius:12px;background:var(--bg-glass);border:1px solid var(--border-subtle);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;">
          <span class="material-icons-round" style="font-size:18px;color:var(--text-secondary);">delete_sweep</span>
        </div>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border-subtle);flex-shrink:0;">
        <div>
          <div style="font-size:11px;font-family:var(--font-mono);color:var(--text-primary);font-weight:700;">Capture Logs</div>
          <div style="font-size:9px;font-family:var(--font-mono);color:var(--text-muted);margin-top:1px;">Off = nothing recorded</div>
        </div>
        <div class="toggle" id="nx-console-toggle" onclick="toggleConsoleLogCapture()"></div>
      </div>
      <div id="nx-console-list" style="flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 0;"></div>
    </div>
