        <!-- Self Transfer UI — compact single-screen layout shared with Multi Key Recipients / W2W (bt-* classes)
             UI-only helpers: scripts/features/transfer/self-transfer-ui-sync.js · styles: styles/features/transfer/th-self-transfer-mobile.css -->
        <div id="selfTransferUI" data-mode="native" style="display: none;">
            <div class="th-section-header"><button class="th-back-btn" onclick="showMainDashboard()" title="Back to Dashboard"><span class="material-icons-round">arrow_back</span></button><h1>Self transfer</h1><button class="th-header-chain-btn" onclick="thOpenChainPicker('selfTransfer')" title="Switch network for Self Transfer"><span class="th-hcb-emoji" id="th-net-emoji-selfTransfer-hdr">⛓️</span><span class="th-hcb-name" id="th-net-name-selfTransfer-hdr">Network</span><span class="material-icons-round">expand_more</span></button></div>

            <!-- Mode Toggle -->
            <div class="bt-seg-wrap">
                <div class="bt-seg" data-mode="native">
                    <button id="selfNativeModeBtn" class="mode-toggle-btn active" onclick="switchSelfTransferMode('native')">Native</button>
                    <button id="selfTokenModeBtn" class="mode-toggle-btn" onclick="switchSelfTransferMode('token')">Token (ERC20)</button>
                </div>
            </div>

            <input type="hidden" id="rpcUrlSelfTransfer" value="">

            <!-- Token contract (Token mode only) + Wallet keys -->
            <div class="bt-card">
                <div id="tokenConfigSelfTransfer" class="bt-row" style="display: none;">
                    <div class="bt-head">
                        <label class="bt-cap" for="tokenAddressSelfTransfer">Token contract</label>
                    </div>
                    <input type="text" id="tokenAddressSelfTransfer" placeholder="0x... token address (ERC20)" autocomplete="off" spellcheck="false" oninput="if(typeof checkSelfTransferExecuteReady==='function')checkSelfTransferExecuteReady();">
                </div>

                <div class="bt-row">
                    <div class="bt-head">
                        <span class="bt-cap">Wallets · <span id="selfTransferKeyCount">0 wallets</span></span>
                        <button type="button" class="bt-select" onclick="thOpenWalletPicker('privateKeysSelfTransfer','multi')"><span class="material-icons-round">account_balance_wallet</span>Select</button>
                    </div>
                    <div class="st-fold">
                        <div class="sk-key-wrapper st-keys" id="privateKeysSelfTransferWrapper">
                            <textarea id="privateKeysSelfTransfer" class="sk-key-textarea sk-masked" placeholder="0xabc123...&#10;0xdef456..." oninput="autoValidateSelfTransferKeys()" autocomplete="off" spellcheck="false"></textarea>
                            <button type="button" class="sk-toggle-btn" id="privateKeysSelfTransferToggleBtn" onclick="skToggleKeyVisibility('privateKeysSelfTransfer','privateKeysSelfTransferToggleBtn')" title="Show/Hide Keys"><span class="material-icons-round sk-eye-icon">visibility_off</span></button>
                        </div>
                        <div class="mk-meta"><span class="st-hint">Invalid keys are removed automatically</span></div>
                    </div>
                </div>
            </div>

            <!-- Amount + TXs per wallet -->
            <div class="bt-card bt-amount">
                <div class="bt-amt-grid">
                    <div class="bt-amt-main" id="nativeAmountGroup">
                        <label class="bt-cap" for="amountPerTx">Amount per TX</label>
                        <div class="bt-amt-input">
                            <input type="text" id="amountPerTx" placeholder="0" value="0" inputmode="decimal" autocomplete="off">
                            <span class="bt-unit bt-unit-native">ETH</span>
                        </div>
                    </div>
                    <div class="bt-amt-main" id="tokenAmountGroup" style="display:none;">
                        <label class="bt-cap" for="tokenAmountPerTx">Amount per TX</label>
                        <div class="bt-amt-input">
                            <input type="text" id="tokenAmountPerTx" placeholder="100" inputmode="decimal" autocomplete="off">
                            <span class="bt-unit bt-unit-token">TOKEN</span>
                        </div>
                    </div>
                    <div class="st-txs">
                        <label class="bt-cap" for="txCountPerWallet">TXs / wallet</label>
                        <div class="bt-stepper">
                            <button type="button" onclick="selfStepTxCount(-1)" aria-label="Fewer transactions">−</button>
                            <input type="number" id="txCountPerWallet" value="1" min="1" max="100" inputmode="numeric">
                            <button type="button" onclick="selfStepTxCount(1)" aria-label="More transactions">+</button>
                        </div>
                    </div>
                </div>
                <div class="bt-chips st-fold st-chips-native">
                    <button class="btn" onclick="selfSetAmount('0')">0</button>
                    <button class="btn" onclick="selfSetAmount('0.0001')">0.0001</button>
                    <button class="btn" onclick="selfSetAmount('0.001')">0.001</button>
                    <button class="btn" onclick="selfSetAmount('0.01')">0.01</button>
                </div>
            </div>

            <!-- Summary -->
            <div class="bt-summary">
                <span><b id="totalWalletsEstimate">0</b> wallets × <b id="txPerWalletEstimate">0</b> each</span>
                <span class="bt-total">Est. total <b id="totalTxEstimate">0</b> TXs</span>
            </div>

            <!-- Gas pill + Execute -->
            <div class="bt-dock">
                <div class="st-act">
                    <div class="bt-gasrow" id="one-gas-toggle-th-self">
                        <button type="button" class="bt-gaspill" onclick="window._ngCycle()" aria-label="Gas type, tap to change" title="Gas type - tap to change">
                            <span class="material-icons-round bt-gaspill-ico">local_gas_station</span>
                            <span class="sw-gas-pill-label bt-gaspill-label">AUTO</span>
                        </button>
                    </div>
                    <div class="execute-section bt-actions">
                        <button class="btn btn-success execute-btn" id="executeSelfTransferBtn" onclick="executeSelfTransfer()" disabled>Execute transfer</button>
                    </div>
                </div>
            </div>

            <!-- Logs: collapsed by default, same strip as Multi Key Recipients / W2W -->
            <div class="log-section bt-logs collapsed" id="selfLogs">
                <div class="bt-loghead" onclick="selfToggleLogs()" role="button" aria-label="Show or hide logs">
                    <span class="material-icons-round bt-logchev">expand_more</span>
                    <span class="bt-cap">Logs</span>
                    <button type="button" class="bt-link" onclick="event.stopPropagation();clearLogSelfTransfer()">Clear</button>
                </div>
                <div class="log-container" id="logContainerSelfTransfer">
                    <div class="log-line log-info">[INFO] Configure settings and click Execute to start self transfers...</div>
                </div>
            </div>
        </div>
