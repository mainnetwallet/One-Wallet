    <!-- Token Approval Manager — compact single-screen layout shared with W2W / Self Transfer / NFT Transfer (bt-* classes)
         UI-only helpers: scripts/features/transfer/token-approval-ui-sync.js · styles: styles/features/transfer/th-token-approval-manager-mobile.css -->
    <div id="tokenApprovalManagerUI" data-amount-mode="unlimited" style="display: none;">
        <div class="th-section-header"><button class="th-back-btn" onclick="showMainDashboard()" title="Back to Dashboard"><span class="material-icons-round">arrow_back</span></button><h1>Token approval</h1><button class="th-header-chain-btn" onclick="thOpenChainPicker('approval')" title="Switch network for Token Approval"><span class="th-hcb-emoji" id="th-net-emoji-approval-hdr">⛓️</span><span class="th-hcb-name" id="th-net-name-approval-hdr">Network</span><span class="material-icons-round">expand_more</span></button></div>

        <input type="hidden" id="rpcUrlApproval" value="">

        <!-- Wallets -->
        <div class="bt-card">
            <div class="bt-row">
                <div class="bt-head">
                    <span class="bt-cap">Wallets · <span id="autoDetectCountApproval">0 keys</span></span>
                    <button type="button" class="bt-select" onclick="thOpenWalletPicker('privateKeyApproval','multi')"><span class="material-icons-round">account_balance_wallet</span>Select</button>
                </div>
                <div class="sk-key-wrapper ap-keys" id="privateKeyApprovalWrapper">
                    <textarea id="privateKeyApproval" class="sk-key-textarea sk-masked" placeholder="0x1234... or 1234...&#10;comma, space or newline separated" autocomplete="off" spellcheck="false" oninput="autoDetectKeysApproval()"></textarea>
                    <button type="button" class="sk-toggle-btn" id="privateKeyApprovalToggleBtn" onclick="skToggleKeyVisibility('privateKeyApproval','privateKeyApprovalToggleBtn')" title="Show/Hide Key"><span class="material-icons-round sk-eye-icon">visibility_off</span></button>
                </div>
                <div class="mk-meta"><span class="st-hint">Any format · labels and invalid keys are ignored</span></div>
            </div>
        </div>

        <!-- Approval details -->
        <div class="bt-card">
            <div class="bt-row">
                <div class="bt-head">
                    <label class="bt-cap" for="tokenAddressApproval">Token contract</label>
                </div>
                <input type="text" id="tokenAddressApproval" placeholder="0x... ERC20 token address" autocomplete="off" spellcheck="false">
            </div>
            <div class="bt-row">
                <div class="bt-head">
                    <label class="bt-cap" for="spenderAddressApproval">Spender</label>
                    <span class="st-hint">DEX router or contract</span>
                </div>
                <input type="text" id="spenderAddressApproval" placeholder="0x... address to approve" autocomplete="off" spellcheck="false">
            </div>
            <div class="bt-row">
                <div class="bt-head">
                    <label class="bt-cap" for="approvalAmount">Amount</label>
                </div>
                <input type="text" id="approvalAmount" placeholder="Empty = unlimited" value="" inputmode="decimal" autocomplete="off">
                <div class="bt-chips ap-chips">
                    <button type="button" class="btn active" id="approvalChipUnlimited" onclick="approvalPickMode('unlimited')">Unlimited</button>
                    <button type="button" class="btn" id="approvalChipCustom" onclick="approvalPickMode('custom')">Custom</button>
                    <button type="button" class="btn" id="approvalChipRevoke" onclick="approvalPickMode('revoke')">Revoke (0)</button>
                </div>
            </div>
        </div>

        <!-- Summary -->
        <div class="bt-summary">
            <span><b id="walletsLoadedApproval">0</b> wallets · <b id="approvalModeLabel">Unlimited</b></span>
            <span class="bt-total"><b id="successCountApproval">0</b> ok · <b id="failedCountApproval">0</b> failed</span>
        </div>

        <!-- Gas pill + Approve + Clear -->
        <div class="bt-dock">
            <div class="st-act">
                <div class="bt-gasrow" id="one-gas-toggle-th-approval">
                    <button type="button" class="bt-gaspill" onclick="window._ngCycle()" aria-label="Gas type, tap to change" title="Gas type - tap to change">
                        <span class="material-icons-round bt-gaspill-ico">local_gas_station</span>
                        <span class="sw-gas-pill-label bt-gaspill-label">AUTO</span>
                    </button>
                </div>
                <div class="execute-section bt-actions">
                    <button class="btn btn-success execute-btn" id="executeApprovalBtn" onclick="executeApproval()" disabled style="opacity:0.45;cursor:not-allowed;">Approve</button>
                    <button type="button" class="btn btn-primary ap-clear" onclick="clearApprovalData()" aria-label="Clear data" title="Clear data"><span class="material-icons-round">delete_outline</span></button>
                </div>
            </div>
        </div>

        <!-- Logs: collapsed by default, same strip as W2W / Self Transfer -->
        <div class="log-section bt-logs collapsed" id="approvalLogs">
            <div class="bt-loghead" onclick="approvalToggleLogs()" role="button" aria-label="Show or hide logs">
                <span class="material-icons-round bt-logchev">expand_more</span>
                <span class="bt-cap">Logs</span>
                <button type="button" class="bt-link" onclick="event.stopPropagation();clearLogApproval()">Clear</button>
            </div>
            <div class="log-container" id="logContainerApproval">
                <div class="log-line log-info">[INFO] Enter wallet and approval details...</div>
            </div>
        </div>
    </div>
