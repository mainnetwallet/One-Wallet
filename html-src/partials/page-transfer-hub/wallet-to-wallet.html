    <!-- Wallet to Wallet Transfer — compact single-screen layout shared with Multi Key Recipients (bt-* classes)
         UI-only helpers: scripts/features/transfer/w2w-ui-sync.js · styles: styles/features/transfer/th-w2w-compact.css -->
    <div id="walletToWalletUI" data-mode="native" style="display: none;">

        <!-- Header -->
        <div class="th-section-header"><button class="th-back-btn" onclick="showMainDashboard()" title="Back to Dashboard"><span class="material-icons-round">arrow_back</span></button><h1>W2W transfer</h1><button class="th-header-chain-btn" onclick="thOpenHeaderChainPicker('w2wNative')" title="Switch network"><span class="th-hcb-emoji" id="th-net-emoji-w2wNative-hdr">⛓️</span><span class="th-hcb-name" id="th-net-name-w2wNative-hdr">Network</span><span class="material-icons-round">expand_more</span></button></div>

        <!-- Mode Toggle -->
        <div class="bt-seg-wrap">
            <div class="bt-seg" data-mode="native">
                <button id="w2wNativeModeBtn" class="mode-toggle-btn active" onclick="selectW2WMode('native')">Native</button>
                <button id="w2wTokenModeBtn" class="mode-toggle-btn" onclick="selectW2WMode('token')">Token</button>
            </div>
        </div>

        <!-- ══ NATIVE MODE ══ -->
        <div id="w2wNativeFields" class="transfer-fields" style="display:block;">
            <input type="hidden" id="rpcUrlW2W" value="">

            <!-- Sender keys + Receivers -->
            <div class="bt-card">
                <div class="bt-row">
                    <div class="bt-head">
                        <span class="bt-cap">Sender keys · <span id="w2wSenderCount">0</span> wallets</span>
                        <button type="button" class="bt-select" onclick="thOpenWalletPicker('w2wSenderKeys','multi')"><span class="material-icons-round">account_balance_wallet</span>Select</button>
                    </div>
                    <div class="w2w-fold">
                        <div class="sk-key-wrapper w2w-keys" id="w2wSenderKeysWrapper">
                            <textarea id="w2wSenderKeys" class="sk-key-textarea sk-masked" placeholder="0xabc123...&#10;0xdef456..." oninput="autoValidateW2WNativeKeys()" autocomplete="off" spellcheck="false"></textarea>
                            <button type="button" class="sk-toggle-btn" id="w2wSenderKeysToggleBtn" onclick="skToggleKeyVisibility('w2wSenderKeys','w2wSenderKeysToggleBtn')" title="Show/Hide Keys"><span class="material-icons-round sk-eye-icon">visibility_off</span></button>
                        </div>
                        <div class="mk-meta"><span class="mk-valid"><b id="w2wTotalSenders">0</b> valid</span></div>
                    </div>
                </div>

                <div class="bt-row">
                    <div class="bt-head">
                        <span class="bt-cap">Receivers · <span id="w2wReceiverCount">0</span> addresses</span>
                        <button type="button" class="bt-select" onclick="thOpenWalletPicker('w2wReceiverKeys','addresses')"><span class="material-icons-round">account_balance_wallet</span>Select</button>
                    </div>
                    <div class="w2w-fold">
                        <textarea id="w2wReceiverKeys" class="w2w-recv" placeholder="0x123... or keys" oninput="autoValidateW2WNativeReceivers()" autocomplete="off" spellcheck="false"></textarea>
                        <div class="mk-meta"><span class="mk-valid"><b id="w2wTotalReceivers">0</b> valid</span><span class="w2w-warn" id="w2wPairWarnNative"></span></div>
                    </div>
                </div>
            </div>

            <!-- Amount -->
            <div class="bt-card bt-amount">
                <div class="bt-amt-grid">
                    <div class="bt-amt-main">
                        <label class="bt-cap" for="w2wCustomAmount">Amount per transfer</label>
                        <div class="bt-amt-input">
                            <input type="text" id="w2wCustomAmount" placeholder="0" value="" inputmode="decimal" autocomplete="off">
                            <span class="bt-unit bt-unit-native">ETH</span>
                        </div>
                    </div>
                </div>
                <div class="bt-chips w2w-fold">
                    <button class="btn mk-max" onclick="setW2WMaxAmount()">MAX</button>
                    <button class="btn" onclick="setW2WAmount('0.00000001')">0.00000001</button>
                    <button class="btn" onclick="setW2WAmount('0.1')">0.1</button>
                    <button class="btn" onclick="setW2WAmount('1')">1</button>
                </div>
            </div>

            <!-- Summary -->
            <div class="bt-summary">
                <span><b id="w2wPairsNative">0</b> pairs × <b id="w2wPerNative">0</b></span>
                <span class="bt-total">Total <b id="w2wTotalNative">0</b> <span class="bt-unit bt-unit-native">ETH</span></span>
            </div>

            <!-- Gas pill + Execute -->
            <div class="bt-dock">
                <div class="w2w-act">
                    <div class="bt-gasrow" id="one-gas-toggle-th-w2w">
                        <button type="button" class="bt-gaspill" onclick="window._ngCycle()" aria-label="Gas type, tap to change" title="Gas type - tap to change">
                            <span class="material-icons-round bt-gaspill-ico">local_gas_station</span>
                            <span class="sw-gas-pill-label bt-gaspill-label">AUTO</span>
                        </button>
                    </div>
                    <div class="execute-section bt-actions">
                        <button class="btn btn-success execute-btn" id="executeW2WBtn" onclick="executeWalletToWallet()" disabled>Execute transfer</button>
                    </div>
                </div>
                <div class="progress-bar" id="progressBarW2W" style="display:none;"><div class="progress-fill" id="progressFillW2W"></div></div>
            </div>
        </div>

        <!-- ══ TOKEN MODE ══ -->
        <div id="w2wTokenFields" class="transfer-fields" style="display:none;">
            <input type="hidden" id="rpcUrlW2WToken" value="">

            <!-- Token contract + Sender keys + Receivers -->
            <div class="bt-card">
                <div class="bt-row">
                    <div class="bt-head">
                        <label class="bt-cap" for="w2wTokenContract">Token contract</label>
                    </div>
                    <input type="text" id="w2wTokenContract" placeholder="0x... token address (ERC20)" autocomplete="off" spellcheck="false" oninput="if(typeof checkW2WExecuteReady==='function')checkW2WExecuteReady();">
                </div>

                <div class="bt-row">
                    <div class="bt-head">
                        <span class="bt-cap">Sender keys · <span id="w2wSenderCountToken">0</span> wallets</span>
                        <button type="button" class="bt-select" onclick="thOpenWalletPicker('w2wSenderKeysToken','multi')"><span class="material-icons-round">account_balance_wallet</span>Select</button>
                    </div>
                    <div class="w2w-fold">
                        <div class="sk-key-wrapper w2w-keys" id="w2wSenderKeysTokenWrapper">
                            <textarea id="w2wSenderKeysToken" class="sk-key-textarea sk-masked" placeholder="0xabc123...&#10;0xdef456..." oninput="autoValidateW2WTokenKeys()" autocomplete="off" spellcheck="false"></textarea>
                            <button type="button" class="sk-toggle-btn" id="w2wSenderKeysTokenToggleBtn" onclick="skToggleKeyVisibility('w2wSenderKeysToken','w2wSenderKeysTokenToggleBtn')" title="Show/Hide Keys"><span class="material-icons-round sk-eye-icon">visibility_off</span></button>
                        </div>
                        <div class="mk-meta"><span class="mk-valid"><b id="w2wTotalSendersToken">0</b> valid</span></div>
                    </div>
                </div>

                <div class="bt-row">
                    <div class="bt-head">
                        <span class="bt-cap">Receivers · <span id="w2wReceiverCountToken">0</span> addresses</span>
                        <button type="button" class="bt-select" onclick="thOpenWalletPicker('w2wReceiverKeysToken','addresses')"><span class="material-icons-round">account_balance_wallet</span>Select</button>
                    </div>
                    <div class="w2w-fold">
                        <textarea id="w2wReceiverKeysToken" class="w2w-recv" placeholder="0x123... or keys" oninput="autoValidateW2WTokenReceivers()" autocomplete="off" spellcheck="false"></textarea>
                        <div class="mk-meta"><span class="mk-valid"><b id="w2wTotalReceiversToken">0</b> valid</span><span class="w2w-warn" id="w2wPairWarnToken"></span></div>
                    </div>
                </div>
            </div>

            <!-- Amount -->
            <div class="bt-card bt-amount">
                <div class="bt-amt-grid">
                    <div class="bt-amt-main">
                        <label class="bt-cap" for="w2wCustomAmountToken">Amount per transfer</label>
                        <div class="bt-amt-input">
                            <input type="text" id="w2wCustomAmountToken" placeholder="0" value="" inputmode="decimal" autocomplete="off">
                            <span class="bt-unit bt-unit-token">TOKEN</span>
                        </div>
                    </div>
                </div>
                <div class="bt-chips w2w-fold">
                    <button class="btn mk-max" onclick="setW2WMaxAmountToken()">MAX</button>
                    <button class="btn" onclick="setW2WAmountToken('1')">1</button>
                    <button class="btn" onclick="setW2WAmountToken('10')">10</button>
                    <button class="btn" onclick="setW2WAmountToken('100')">100</button>
                </div>
            </div>

            <!-- Summary -->
            <div class="bt-summary">
                <span><b id="w2wPairsToken">0</b> pairs × <b id="w2wPerToken">0</b></span>
                <span class="bt-total">Total <b id="w2wTotalToken">0</b> <span class="bt-unit bt-unit-token">TOKEN</span></span>
            </div>

            <!-- Gas pill + Execute -->
            <div class="bt-dock">
                <div class="w2w-act">
                    <div class="bt-gasrow" id="one-gas-toggle-th-w2w-token">
                        <button type="button" class="bt-gaspill" onclick="window._ngCycle()" aria-label="Gas type, tap to change" title="Gas type - tap to change">
                            <span class="material-icons-round bt-gaspill-ico">local_gas_station</span>
                            <span class="sw-gas-pill-label bt-gaspill-label">AUTO</span>
                        </button>
                    </div>
                    <div class="execute-section bt-actions">
                        <button class="btn btn-success execute-btn" id="executeW2WTokenBtn" onclick="executeWalletToWalletToken()" disabled>Execute transfer</button>
                    </div>
                </div>
                <div class="progress-bar" id="progressBarW2WToken" style="display:none;"><div class="progress-fill" id="progressFillW2WToken"></div></div>
            </div>
        </div>

        <!-- Logs (shared by Native + Token): collapsed by default, same strip as Multi Key Recipients -->
        <div class="log-section bt-logs collapsed" id="w2wLogs">
            <div class="bt-loghead" onclick="w2wToggleLogs()" role="button" aria-label="Show or hide logs">
                <span class="material-icons-round bt-logchev">expand_more</span>
                <span class="bt-cap">Logs</span>
                <button type="button" class="bt-link" onclick="event.stopPropagation();clearLogW2W()">Clear</button>
            </div>
            <div class="log-container" id="logSectionW2W">
                <div class="log-line log-info">[INFO] Ready to configure wallet to wallet transfer...</div>
            </div>
        </div>
    </div>
