        <!-- Balance Check — compact single-screen layout shared with W2W / Self Transfer / NFT Transfer / Token Approval / Withdraw Manager (bt-* classes)
             UI-only helpers: scripts/features/transfer/balance-check-ui-sync.js · styles: styles/features/transfer/th-balance-check-mobile.css -->
        <div id="balanceCheckUI" data-mode="native" style="display: none;">
                    <div class="th-section-header"><button class="th-back-btn" onclick="showMainDashboard()" title="Back to Dashboard"><span class="material-icons-round">arrow_back</span></button><h1>Balance check</h1><button class="th-header-chain-btn" onclick="thOpenChainPicker('balanceCheck')" title="Switch network for Balance Check"><span class="th-hcb-emoji" id="th-net-emoji-balanceCheck-hdr">⛓️</span><span class="th-hcb-name" id="th-net-name-balanceCheck-hdr">Network</span><span class="material-icons-round">expand_more</span></button></div>

            <input type="hidden" id="rpcUrlBalanceCheck" value="">

            <!-- Native / Token switch (Native = token address empty, same rule as before) -->
            <div class="bt-seg-wrap">
                <div class="bt-seg" data-mode="native">
                    <button type="button" id="bcNativeModeBtn" class="mode-toggle-btn active" onclick="bcPickMode('native')">Native</button>
                    <button type="button" id="bcTokenModeBtn" class="mode-toggle-btn" onclick="bcPickMode('token')">Token</button>
                </div>
            </div>

            <!-- Token contract (Token mode only) + Wallets -->
            <div class="bt-card">
                <div class="bt-row" id="bcTokenRow">
                    <div class="bt-head">
                        <label class="bt-cap" for="tokenAddressBalanceCheck">Token contract</label>
                        <span class="st-hint">Empty = native balance</span>
                    </div>
                    <input type="text" id="tokenAddressBalanceCheck" placeholder="0x... token address (ERC20)" autocomplete="off" spellcheck="false">
                </div>

                <div class="bt-row">
                    <div class="bt-head">
                        <span class="bt-cap">Wallets · <span id="bcFoundCount">0 found</span></span>
                        <button type="button" class="bt-select" onclick="thOpenWalletPicker('inputBalanceCheck','multi')"><span class="material-icons-round">account_balance_wallet</span>Select</button>
                    </div>
                    <textarea id="inputBalanceCheck" class="bc-input" placeholder="0x1234... or 1234...&#10;comma, space or newline separated" autocomplete="off" spellcheck="false"></textarea>
                    <div class="mk-meta"><span class="st-hint" id="bcFoundDetail">Addresses and private keys · labels and invalid lines are ignored</span></div>
                </div>
            </div>

            <!-- Summary -->
            <div class="bt-summary">
                <span><b id="totalAddressesBalance">0</b> wallets checked</span>
                <span class="bt-total">Total <b id="totalBalanceSum">0</b></span>
            </div>

            <!-- Check + Clear -->
            <div class="bt-dock">
                <div class="st-act">
                    <div class="execute-section bt-actions">
                        <button id="checkBalancesBtn" class="btn btn-success execute-btn" onclick="checkBalances()" style="opacity:0.45;cursor:not-allowed;" disabled>Check balances</button>
                        <button type="button" class="btn btn-primary ap-clear" onclick="clearBalanceCheck()" aria-label="Clear all" title="Clear all"><span class="material-icons-round">delete_outline</span></button>
                    </div>
                </div>
            </div>

            <!-- Results -->
            <div class="bt-card bc-results">
                <div class="bt-head">
                    <span class="bt-cap">Results</span>
                    <span class="bc-tools">
                        <button type="button" class="bt-select bc-export" onclick="exportBalanceCSV()">CSV</button>
                        <button type="button" class="bt-select bc-export" onclick="exportBalanceJSON()">JSON</button>
                    </span>
                </div>
                <div id="balanceResultsList">
                    <div class="bc-none">
                        <div class="bc-none-t">No results yet</div>
                        <div class="bc-none-s">Add wallets and tap Check balances</div>
                    </div>
                </div>
            </div>

            <!-- Logs: collapsed by default, same strip as the other tools -->
            <div class="log-section bt-logs collapsed" id="bcLogs">
                <div class="bt-loghead" onclick="bcToggleLogs()" role="button" aria-label="Show or hide logs">
                    <span class="material-icons-round bt-logchev">expand_more</span>
                    <span class="bt-cap">Logs</span>
                    <button type="button" class="bt-link" onclick="event.stopPropagation();clearLogBalanceCheck()">Clear</button>
                </div>
                <div class="log-container" id="logContainerBalanceCheck">
                </div>
            </div>

        </div>
