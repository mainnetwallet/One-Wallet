<!-- ══ Network Select Modal ══ -->
<div id="exc-dep-net-overlay" style="display:none;position:fixed;inset:0;z-index:30001;background:rgba(0,0,0,0.65);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);" onclick="excDepositNetModalClose(event)">
  <div id="exc-dep-net-sheet" style="position:absolute;bottom:0;left:0;right:0;background:#0f0f1a;border-radius:20px 20px 0 0;max-height:80vh;display:flex;flex-direction:column;overflow:hidden;transform:translateY(100%);transition:transform 0.28s cubic-bezier(0.32,0.72,0,1);">
    <!-- Modal header -->
    <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px;border-bottom:1px solid rgba(255,255,255,0.06);flex-shrink:0;">
      <div style="font-size:16px;font-weight:700;color:#f1f1f8;">Select Network</div>
      <div onclick="excDepositNetModalClose(null,true)" style="width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;">
        <span class="material-icons-round" style="font-size:18px;color:#8b8ba7;">close</span>
      </div>
    </div>
    <!-- Network list -->
    <div id="exc-dep-net-list" style="flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 0 28px;"></div>
  </div>
</div>
