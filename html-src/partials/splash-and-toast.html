<div id="splash">
  <div class="splash-wordmark">ONE WALLET</div>
  <div class="splash-loader">
    <div class="splash-loader-bar"></div>
  </div>
</div>
<script>
(function () {
  var sp = document.getElementById('splash');
  if (!sp) return;
  var done = false;
  function hide() {
    if (done) return;
    done = true;
    sp.classList.add('hide');
    setTimeout(function () { sp.style.display = 'none'; }, 320);
  }
  if (document.readyState === 'complete') setTimeout(hide, 250);
  else window.addEventListener('load', function () { setTimeout(hide, 250); });
  setTimeout(hide, 2500); // failsafe: never block the app
})();
</script>
