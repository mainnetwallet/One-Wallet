  <div class="del-group-drawer-overlay" id="rpc-manager-overlay" onclick="if(event.target===this)closeRpcManager()" style="position:fixed;top:0;left:0;right:0;bottom:calc(var(--nav-height) + env(safe-area-inset-bottom, 0px));z-index:950;background:rgba(5,5,8,0.75);opacity:0;pointer-events:none;transition:opacity 0.3s ease;will-change:opacity;">
    <div class="del-group-drawer" id="rpc-manager-drawer" style="position:absolute;top:0;right:0;bottom:0;width:min(300px,85%);background:var(--bg-deep);border-left:1px solid var(--border-subtle);display:flex;flex-direction:column;transform:translateX(100%);transition:transform 0.38s cubic-bezier(0.22,1,0.36,1);box-shadow:-8px 0 40px rgba(0,0,0,0.5);overflow:hidden;">

    <!-- Header -->
    <div class="del-drawer-header">
      <div class="del-drawer-close" id="rpc-back-btn" onclick="rpcDrawerGoBack()" style="display:none;">
        <span class="material-icons-round" style="font-size:20px;color:var(--text-secondary);">arrow_back</span>
      </div>
      <div class="del-drawer-close" id="rpc-close-btn" onclick="closeRpcManager()">
        <span class="material-icons-round" style="font-size:20px;color:var(--text-secondary);">close</span>
      </div>
      <div class="del-drawer-title" id="rpc-drawer-title">Custom RPC</div>
      <div class="del-drawer-badge" id="rpc-drawer-badge">SELECT CHAIN</div>
    </div>

    <!-- View 1: Chain list -->
    <div id="rpc-view-chains" style="flex:1;overflow-y:auto;scrollbar-width:none;padding:12px 16px 24px;display:flex;flex-direction:column;gap:8px;"></div>

    <!-- View 2: RPC list for selected chain -->
    <div id="rpc-view-detail" style="display:none;flex:1;overflow:hidden;padding:0;flex-direction:column;">

      <!-- Chain info banner -->
      <div id="rpc-detail-banner" style="padding:14px 18px 12px;border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;gap:12px;">
        <div id="rpc-detail-emoji" style="font-size:24px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:var(--bg-raised);flex-shrink:0;"></div>
        <div>
          <div id="rpc-detail-name" style="font-size:15px;font-weight:700;color:var(--text-primary);font-family:var(--font-display);"></div>
          <div id="rpc-detail-chainid" style="font-size:10px;color:var(--text-muted);font-family:var(--font-mono);margin-top:2px;"></div>
        </div>
      </div>

      <!-- RPC list -->
      <div id="rpc-list-container" style="flex:1;overflow-y:auto;scrollbar-width:none;padding:12px 16px;display:flex;flex-direction:column;gap:8px;"></div>

      <!-- Add RPC form -->
      <div style="padding:12px 16px 20px;border-top:1px solid var(--border-subtle);flex-shrink:0;background:var(--bg-deep);z-index:2;">
        <div style="font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--text-muted);font-family:var(--font-mono);margin-bottom:8px;">ADD NEW RPC</div>
        <div style="display:flex;gap:8px;align-items:center;">
          <input id="rpc-new-url-input" type="text" inputmode="url" placeholder="https://rpc.example.com"
            style="flex:1;min-width:0;background:var(--bg-raised);border:1px solid var(--border-subtle);border-radius:10px;padding:10px 12px;color:var(--text-primary);font-family:var(--font-mono);font-size:11px;outline:none;"
            autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false"
            oninput="document.getElementById('rpc-add-err').textContent=''"
            onkeydown="if(event.key==='Enter'){event.preventDefault();event.stopPropagation();rpcAddNew();}" />
          <button onclick="event.preventDefault();event.stopPropagation();rpcAddNew();" style="padding:10px 14px;background:linear-gradient(135deg,var(--accent-primary),var(--accent-secondary));border:none;border-radius:10px;color:#fff;font-family:var(--font-display);font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;">
            Add
          </button>
        </div>
        <div id="rpc-add-err" style="font-size:10px;font-family:var(--font-mono);color:var(--accent-red);margin-top:5px;min-height:14px;"></div>
      </div>
    </div>

  </div>
  </div>
