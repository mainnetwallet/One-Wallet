<!-- ══════ STEP 3: Create Wallet UI ══════ -->
<div class="send-overlay" id="wg-create-overlay" style="z-index:775;">
  <div class="send-modal" data-no-swipe="1">

    <div class="send-header">
      <div class="send-back-btn" onclick="closeWgCreateUI()">
        <span class="material-icons-round">arrow_back</span>
      </div>
      <div class="send-header-title">Create Wallet</div>
      <div id="wg-create-count-badge" style="padding:4px 10px;border-radius:8px;background:rgba(16,185,129,0.15);border:1px solid rgba(16,185,129,0.3);font-size:10px;font-weight:700;color:#10b981;font-family:var(--font-mono);display:none;">0 WALLETS</div>
    </div>

    <div class="send-body" style="padding:16px 20px 40px;display:flex;flex-direction:column;gap:16px;">

      <!-- Group name -->
      <div style="display:flex;flex-direction:column;gap:6px;">
        <div style="font-size:9px;font-weight:700;color:var(--text-muted);letter-spacing:1.5px;font-family:var(--font-mono);">GROUP NAME</div>
        <input type="text" id="wg-create-name-input" class="send-input"
          style="font-family:var(--font-display);font-size:13px;font-weight:700;"
          placeholder="e.g. Fresh Wallets, Batch A…"
          autocomplete="off" spellcheck="false"
          oninput="_wgCreateUpdateBtn()" />
      </div>

      <!-- Wallet count -->
      <div style="display:flex;flex-direction:column;gap:6px;">
        <div style="font-size:9px;font-weight:700;color:var(--text-muted);letter-spacing:1.5px;font-family:var(--font-mono);">HOW MANY WALLETS?</div>
        <!-- Quick preset buttons -->
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button onclick="wgCreateSetCount(1)" class="wg-count-preset" id="wgcp-1">1</button>
          <button onclick="wgCreateSetCount(5)" class="wg-count-preset" id="wgcp-5">5</button>
          <button onclick="wgCreateSetCount(10)" class="wg-count-preset" id="wgcp-10">10</button>
          <button onclick="wgCreateSetCount(25)" class="wg-count-preset" id="wgcp-25">25</button>
          <button onclick="wgCreateSetCount(50)" class="wg-count-preset" id="wgcp-50">50</button>
          <button onclick="wgCreateSetCount(100)" class="wg-count-preset" id="wgcp-100">100</button>
        </div>
        <input type="number" id="wg-create-count-input" class="send-input"
          style="font-family:var(--font-mono);font-size:14px;font-weight:700;letter-spacing:1px;"
          placeholder="Custom (1, 500, 1000…)"
          min="1"
          oninput="_wgCreateSyncPresets();_wgCreateUpdateBtn()" />
      </div>

      <!-- Generate button -->
      <button id="wg-create-gen-btn" onclick="wgGenerateWallets()"
        style="width:100%;padding:14px;background:linear-gradient(135deg,#10b981,#059669);border:none;border-radius:var(--radius-md);font-family:var(--font-display);font-size:14px;font-weight:800;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 0 18px rgba(16,185,129,0.35);opacity:0.5;pointer-events:none;transition:all 0.2s;">
        <span class="material-icons-round" style="font-size:18px;">auto_awesome</span>GENERATE
      </button>

      <!-- Preview list -->
      <div id="wg-create-preview" style="display:none;flex-direction:column;gap:8px;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div style="font-size:9px;font-weight:700;color:var(--text-muted);letter-spacing:1.5px;font-family:var(--font-mono);">GENERATED WALLETS</div>
          <div onclick="wgCopyAllMnemonics()" id="wg-copy-all-btn" style="display:flex;align-items:center;gap:4px;cursor:pointer;padding:3px 9px;background:rgba(99,102,241,0.12);border:1px solid rgba(99,102,241,0.3);border-radius:8px;font-size:10px;font-weight:700;color:var(--accent-primary);font-family:var(--font-mono);">
            <span class="material-icons-round" style="font-size:13px;">content_copy</span>COPY
          </div>
        </div>
        <div id="wg-create-wallet-list" style="display:flex;flex-direction:column;gap:6px;max-height:220px;overflow-y:auto;padding-right:2px;"></div>
      </div>

      <!-- Save button -->
      <button id="wg-create-save-btn" onclick="wgSaveCreatedGroup()"
        style="width:100%;padding:14px;background:linear-gradient(135deg,var(--accent-primary),var(--accent-secondary));border:none;border-radius:var(--radius-md);font-family:var(--font-display);font-size:14px;font-weight:800;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:var(--glow-primary);opacity:0.5;pointer-events:none;transition:all 0.2s;display:none;">
        <span class="material-icons-round" style="font-size:18px;">save</span>SAVE GROUP
      </button>

    </div>
  </div>
</div>
