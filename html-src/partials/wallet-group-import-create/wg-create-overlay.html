<!-- ══════ STEP 3: Create Wallet UI (2 steps: setup, review) ══════ -->
<div class="send-overlay" id="wg-create-overlay" style="z-index:775;">
  <div class="send-modal" data-no-swipe="1">

    <div class="send-header">
      <div class="send-back-btn" onclick="closeWgCreateUI()">
        <span class="material-icons-round">arrow_back</span>
      </div>
      <div class="send-header-title" id="wg-create-title">Create wallets</div>
      <div class="wgc-step" id="wg-create-step-label">Step 1 of 2</div>
    </div>

    <div class="send-body wgc-body">

      <!-- ══ STEP 1: setup ══ -->
      <div class="wgc-step-panel" id="wg-create-step1">

        <div class="wgc-field">
          <div class="wgc-label">Group name</div>
          <input type="text" id="wg-create-name-input" class="send-input wgc-name"
            placeholder="Batch A"
            autocomplete="off" spellcheck="false"
            oninput="_wgCreateUpdateBtn()" />
          <div class="wgc-suggest">
            <button type="button" class="wgc-sug" onclick="wgCreateSetName('Fresh wallets')">Fresh wallets</button>
            <button type="button" class="wgc-sug" onclick="wgCreateSetName('Airdrop')">Airdrop</button>
            <button type="button" class="wgc-sug" onclick="wgCreateSetName('Testing')">Testing</button>
          </div>
        </div>

        <div class="wgc-card">
          <div class="wgc-label">How many wallets</div>
          <div class="wgc-stepper">
            <button type="button" class="wgc-round" aria-label="Decrease" onclick="wgCreateStep(-1)">
              <span class="material-icons-round">remove</span>
            </button>
            <div class="wgc-count-wrap">
              <input type="number" id="wg-create-count-input" class="wgc-count"
                inputmode="numeric" min="1" value="10"
                oninput="_wgCreateSyncPresets();_wgCreateUpdateBtn()" />
              <div class="wgc-count-sub" id="wg-create-count-sub">wallets</div>
            </div>
            <button type="button" class="wgc-round" aria-label="Increase" onclick="wgCreateStep(1)">
              <span class="material-icons-round">add</span>
            </button>
          </div>
          <div class="wgc-presets">
            <button type="button" onclick="wgCreateSetCount(1)" class="wg-count-preset" id="wgcp-1">1</button>
            <button type="button" onclick="wgCreateSetCount(5)" class="wg-count-preset" id="wgcp-5">5</button>
            <button type="button" onclick="wgCreateSetCount(10)" class="wg-count-preset" id="wgcp-10">10</button>
            <button type="button" onclick="wgCreateSetCount(25)" class="wg-count-preset" id="wgcp-25">25</button>
            <button type="button" onclick="wgCreateSetCount(50)" class="wg-count-preset" id="wgcp-50">50</button>
            <button type="button" onclick="wgCreateSetCount(100)" class="wg-count-preset" id="wgcp-100">100</button>
          </div>
        </div>

        <div class="wgc-note">
          <span class="material-icons-round">shield</span>
          <div>Each wallet gets its own recovery phrase. Keys stay on this device.</div>
        </div>

        <button type="button" id="wg-create-gen-btn" class="wgc-primary" onclick="wgGenerateWallets()">
          <span class="material-icons-round">auto_awesome</span><span id="wg-create-gen-label">Generate 10 wallets</span>
        </button>
      </div>

      <!-- ══ STEP 2: review ══ -->
      <div class="wgc-step-panel" id="wg-create-step2" style="display:none;">

        <div class="wgc-done">
          <div class="wgc-done-ico"><span class="material-icons-round">check</span></div>
          <div>
            <div class="wgc-done-title" id="wg-create-done-title">0 wallets generated</div>
            <div class="wgc-done-sub" id="wg-create-done-sub">Group: -</div>
          </div>
        </div>

        <div class="wgc-warn">
          <span class="material-icons-round">warning_amber</span>
          <div>Back up your recovery phrases before saving. They can't be recovered later.</div>
        </div>

        <div class="wgc-list" id="wg-create-wallet-list"></div>
        <button type="button" class="wgc-more" id="wg-create-more-btn" onclick="wgCreateToggleMore()" style="display:none;"></button>

        <div class="wgc-actions">
          <button type="button" id="wg-copy-all-btn" class="wgc-secondary" onclick="wgCopyAllMnemonics()">
            <span class="material-icons-round">content_copy</span>Copy phrases
          </button>
          <button type="button" id="wg-create-save-btn" class="wgc-primary" onclick="wgSaveCreatedGroup()">
            <span class="material-icons-round">save</span>Save group
          </button>
        </div>
      </div>

    </div>
  </div>
</div>
