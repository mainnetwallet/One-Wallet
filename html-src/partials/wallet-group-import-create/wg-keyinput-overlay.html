<!-- ══════ STEP 2: Key / Phrase Input UI ══════ -->
<div class="send-overlay" id="wg-keyinput-overlay" style="z-index:770;">
  <div class="send-modal" data-no-swipe="1">

    <div class="send-header">
      <div class="send-back-btn" onclick="closeWgKeyInputUI()">
        <span class="material-icons-round">arrow_back</span>
      </div>
      <div class="send-header-title">Import key or phrase</div>
    </div>

    <div class="send-body" style="padding:8px 16px 40px;display:flex;flex-direction:column;gap:18px;">

      <!-- Group name -->
      <div style="display:flex;flex-direction:column;gap:8px;">
        <div class="wg-field-label">Group name</div>
        <input type="text" id="wg-name-input" class="send-input"
          placeholder="e.g. Group 1–50, Wallet Batch A"
          autocomplete="off" spellcheck="false"
          oninput="onWgKeyInput()"
          onpaste="setTimeout(onWgKeyInput,10)"
          onchange="onWgKeyInput()" />
      </div>

      <!-- ── Import Mode Tabs ── -->
      <div class="wg-tab-bar">
        <button class="wg-tab active" id="wg-tab-pk" onclick="wgSwitchTab('pk')">
          <span class="material-icons-round">vpn_key</span>Private key
        </button>
        <button class="wg-tab" id="wg-tab-mn" onclick="wgSwitchTab('mn')">
          <span class="material-icons-round">format_list_numbered</span>Mnemonic
        </button>
      </div>

      <!-- ══ PANEL: Private Key ══ -->
      <div class="wg-panel active" id="wg-panel-pk" style="gap:18px;">
        <div class="wg-keybox">
          <textarea id="wg-key-textarea" class="key-textarea wg-mono"
            style="height:190px;"
            placeholder="0xabc123...&#10;0xdef456...&#10;&#10;Paste up to 200 private keys,&#10;one per line."
            oninput="onWgKeyInput()"
            onpaste="setTimeout(onWgKeyInput,10)"
            onchange="onWgKeyInput()"
            spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
          <div class="wg-keybox-foot">
            <div class="wg-keybox-hint">One key per line</div>
            <div class="wg-keybox-act">
              <button type="button" class="wg-link-btn" onclick="wgPasteInto('pk')"><span class="material-icons-round">content_paste</span>Paste</button>
              <button type="button" class="wg-link-btn" onclick="wgClearInput('pk')"><span class="material-icons-round">close</span>Clear</button>
            </div>
          </div>
        </div>

        <!-- Valid / invalid / duplicate summary -->
        <div class="wg-sum" id="wg-key-summary"></div>

        <!-- Wallet preview -->
        <div class="wg-prev" id="wg-key-preview-wrap">
          <div class="wg-sec-label">Preview</div>
          <div class="wg-listcard" id="wg-key-preview"></div>
        </div>
      </div>

      <!-- ══ PANEL: Mnemonic Phrase ══ -->
      <div class="wg-panel" id="wg-panel-mn" style="gap:18px;">
        <!-- Bulk phrase textarea -->
        <div style="display:flex;flex-direction:column;gap:8px;">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div class="wg-field-label">Recovery phrases</div>
            <div id="wg-mn-line-badge" class="wg-count-badge">0 valid</div>
          </div>
          <div class="wg-keybox">
            <textarea id="wg-mn-bulk-textarea" class="key-textarea" style="height:160px;"
              placeholder="word1 word2 word3 ... word12&#10;apple banana cherry ... phrase2&#10;&#10;Paste one full phrase per line.&#10;Supports 12 / 15 / 18 / 24 word phrases."
              oninput="wgOnMnemInput()"
              onpaste="setTimeout(wgOnMnemInput,10)"
              onchange="wgOnMnemInput()"
              spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
            <div class="wg-keybox-foot">
              <div class="wg-keybox-hint">One phrase per line</div>
              <div class="wg-keybox-act">
                <button type="button" class="wg-link-btn" onclick="wgPasteInto('mn')"><span class="material-icons-round">content_paste</span>Paste</button>
                <button type="button" class="wg-link-btn" onclick="wgClearInput('mn')"><span class="material-icons-round">close</span>Clear</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Live phrase validation list -->
        <div id="wg-mn-phrase-list" style="display:none;flex-direction:column;gap:5px;max-height:130px;overflow-y:auto;scrollbar-width:none;"></div>

        <!-- Derivation settings -->
        <div style="display:flex;flex-direction:column;gap:10px;">
          <div class="wg-field-label">Derivation settings</div>
          <div class="wg-deriv-row">
            <span class="wg-deriv-label">Path</span>
            <select class="wg-deriv-select" id="wg-deriv-path" onchange="wgOnMnemInput()">
              <option value="m/44'/60'/0'/0">m/44'/60'/0'/0 — MetaMask</option>
              <option value="m/44'/60'/0'">m/44'/60'/0' — Ledger Legacy</option>
              <option value="m/44'/60'">m/44'/60' — Trezor</option>
            </select>
          </div>
          <div class="wg-deriv-row">
            <span class="wg-deriv-label">Index</span>
            <div class="wg-wallet-range">
              <span>From</span>
              <input type="number" id="wg-mn-from" value="0" min="0" max="999" oninput="wgOnMnemInput()" />
              <span>to</span>
              <input type="number" id="wg-mn-to" value="0" min="0" max="999" oninput="wgOnMnemInput()" />
            </div>
          </div>
        </div>

        <!-- Summary status -->
        <div class="wg-mnem-status" id="wg-mnem-status">
          <span class="material-icons-round" id="wg-mnem-status-icon">check_circle</span>
          <span id="wg-mnem-status-text"></span>
        </div>

        <div id="wg-mnem-count" class="wg-count-badge" style="align-self:flex-start;display:none;">0 wallets</div>
      </div>

      <!-- Save button -->
      <button id="wg-save-btn" class="wg-primary-btn" onclick="saveWalletGroup()">
        <span id="wg-save-label">Import wallets</span>
      </button>

    </div>
  </div>
</div>
