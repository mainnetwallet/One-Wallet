        <!-- ══ STEP 4: RUN ══ -->
        <div id="swap-step-4" style="display:none;">

          <!-- Summary card -->
          <div class="run-summary-card" id="run-summary">
            <div class="run-sum-row">
              <span class="run-sum-label">WALLETS</span>
              <span class="run-sum-value" id="sum-wallets">—</span>
            </div>
            <div class="run-sum-row">
              <span class="run-sum-label">TOTAL SWAPS</span>
              <span class="run-sum-value" id="sum-total-swaps">—</span>
            </div>
            <div class="run-sum-row">
              <span class="run-sum-label">PAIR</span>
              <span class="run-sum-value" id="sum-pair">—</span>
            </div>
            <div class="run-sum-row">
              <span class="run-sum-label">GAS</span>
              <span class="run-sum-value" id="sum-gas" style="color:var(--accent-green)">FREE (PAYMASTER)</span>
            </div>
            <div class="run-sum-row">
              <span class="run-sum-label">INTEGRATOR</span>
              <span class="run-sum-value" id="sum-integrator">nansen-trading-free</span>
            </div>
            <div class="run-sum-row">
              <span class="run-sum-label">CIRCULAR</span>
              <span class="run-sum-value" style="color:var(--neon-cyan)">Alt · Hold · Circular</span>
            </div>
          </div>

          <!-- Progress bars per wallet -->
          <div id="wallet-progress-section" style="display:none;">
            <div class="section-title" style="padding-top:4px;">WALLET PROGRESS</div>
            <!-- TO Address Verify Status Badge — centered inside the box -->
            <div id="nansen-toadd-verify-wrap" style="display:none;margin-bottom:10px;padding:8px 12px;background:var(--bg-glass);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);text-align:center;">
              <div style="display:inline-flex;align-items:center;gap:8px;justify-content:center;">
                <span class="material-icons-round" style="font-size:14px;color:var(--accent-amber);" id="nansen-toadd-verify-icon">verified_user</span>
                <span id="nansen-toadd-verify-badge" style="font-family:var(--font-mono);font-size:10px;color:var(--accent-amber);letter-spacing:0.5px;">⏳ TO address verify pending…</span>
              </div>
            </div>
            <div id="wallet-progress-list"></div>
          </div>

          <!-- Run controls -->
          <div style="display:flex;gap:10px;" id="run-controls">
            <button class="swap-btn" style="background:var(--bg-raised);box-shadow:none;flex:0 0 48px;padding:0;" onclick="goToStep3()" id="back-btn-3">
              <span class="material-icons-round" style="font-size:20px;">arrow_back</span>
            </button>
            <button class="swap-btn" style="flex:1;" id="run-btn" onclick="startSwapBot()">
              Start Bot
            </button>
          </div>

          <!-- Resume from wallet row (shown after stop/done) -->
          <!-- ══ TERMINAL LOG CARD ══ -->
          <div id="terminal-card" style="display:none;margin-top:12px;background:var(--bg-raised);border:1.5px solid rgba(99,102,241,0.25);border-radius:14px;overflow:hidden;">
            <!-- Terminal header -->
            <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px 8px;border-bottom:1px solid var(--border-subtle);background:rgba(5,5,8,0.6);">
              <div style="display:flex;align-items:center;gap:8px;">
                <span class="material-icons-round" style="font-size:14px;color:var(--accent-primary);">terminal</span>
                <span style="font-family:var(--font-mono);font-size:10px;font-weight:700;color:var(--text-secondary);letter-spacing:1.5px;">BOT LOG</span>
              </div>
              <span id="terminal-status" class="term-status-badge" style="display:none;font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:1px;padding:3px 9px;border-radius:6px;background:rgba(99,102,241,0.15);color:var(--accent-primary);border:1px solid rgba(99,102,241,0.3);">● RUNNING</span>
            </div>
            <!-- Log output -->
            <div id="log-output"
              style="font-family:var(--font-mono);font-size:10px;line-height:1.7;padding:10px 12px;max-height:220px;overflow-y:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;background:rgba(5,5,8,0.5);color:var(--text-secondary);">
            </div>
          </div>

          <div id="resume-row" style="display:none;margin-top:10px;background:var(--bg-glass);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:12px 14px;">
            <div style="font-size:9px;font-weight:700;color:var(--text-muted);font-family:var(--font-mono);letter-spacing:1.5px;margin-bottom:8px;">RESUME FROM WALLET</div>
            <div style="display:flex;align-items:center;gap:8px;">
              <div style="display:flex;align-items:center;gap:6px;flex:1;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:10px;padding:8px 12px;">
                <span class="material-icons-round" style="font-size:15px;color:var(--accent-primary);">account_balance_wallet</span>
                <span style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted);">W#</span>
                <input id="resume-wallet-input" type="number" min="1" placeholder="—"
                  style="background:none;border:none;outline:none;font-family:var(--font-mono);font-size:13px;font-weight:700;color:var(--text-primary);width:60px;"
                  oninput="onResumeInputChange()">
                <span id="resume-saved-badge" style="display:none;font-size:9px;font-weight:700;color:var(--accent-green);font-family:var(--font-mono);background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.3);border-radius:6px;padding:2px 7px;">SAVED</span>
              </div>
              <div onclick="clearResumeWallet()" style="width:36px;height:36px;border-radius:10px;background:rgba(244,63,94,0.1);border:1px solid rgba(244,63,94,0.25);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all 0.2s;" onmousedown="this.style.opacity='0.6'" onmouseup="this.style.opacity='1'" ontouchstart="this.style.opacity='0.6'" ontouchend="this.style.opacity='1'" title="Clear saved wallet">
                <span class="material-icons-round" style="font-size:16px;color:var(--accent-red);">delete_sweep</span>
              </div>
            </div>
            <div id="resume-hint" style="font-size:10px;color:var(--text-muted);font-family:var(--font-mono);margin-top:6px;"></div>
          </div>
        </div>
