        <!-- ══ STEP 2: PAIR ══ -->
        <div id="swap-step-2" style="display:none;">

          <!-- Saved Pairs -->
          <div class="key-input-card" style="margin-bottom:14px;">
            <div class="key-input-header" style="margin-bottom:12px;">
              <div style="display:flex;align-items:center;gap:10px;">
                <div class="key-input-icon" style="background:rgba(34,211,238,0.15);border-color:rgba(34,211,238,0.25);">
                  <span class="material-icons-round" style="color:var(--neon-cyan);">bookmarks</span>
                </div>
                <div>
                  <div class="key-input-title">Saved Pairs</div>
                  <div class="key-input-sub">Tap a pair to select it</div>
                </div>
              </div>
              <div style="display:flex;align-items:center;gap:8px;">
                <div class="key-count-badge" id="pair-saved-count" style="display:none;">0 PAIRS</div>
                <div onclick="openPairManager()" style="display:flex;align-items:center;gap:5px;cursor:pointer;padding:6px 12px;background:var(--bg-glass);border:1px solid var(--border-subtle);border-radius:10px;transition:all 0.2s ease;" onmousedown="this.style.transform='scale(0.93)'" onmouseup="this.style.transform=''" ontouchstart="this.style.transform='scale(0.93)'" ontouchend="this.style.transform=''">
                  <span class="material-icons-round" style="font-size:15px;color:var(--accent-primary)">manage_search</span>
                  <span style="font-size:10px;font-weight:700;color:var(--text-secondary);font-family:var(--font-mono);letter-spacing:1px;">MANAGE</span>
                </div>
              </div>
            </div>
            <div id="saved-pairs-list" style="display:flex;flex-direction:column;gap:8px;">
              <div id="no-pairs-msg" style="text-align:center;padding:18px;color:var(--text-muted);font-family:var(--font-mono);font-size:11px;letter-spacing:1px;">
                NO SAVED PAIRS YET
              </div>
            </div>
          </div>

          <!-- Create New Pair — collapsible -->
          <div class="config-card" style="margin-bottom:14px;padding:0;overflow:hidden;">
            <!-- Header — always visible, click to toggle -->
            <div id="create-pair-header" onclick="toggleCreatePair()" style="display:flex;align-items:center;gap:12px;padding:16px 18px;cursor:pointer;transition:background 0.2s;" onmousedown="this.style.background='var(--bg-raised)'" onmouseup="this.style.background=''" ontouchstart="this.style.background='var(--bg-raised)'" ontouchend="this.style.background=''">
              <div style="width:36px;height:36px;border-radius:10px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.25);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                <span class="material-icons-round" style="color:var(--accent-primary);font-size:18px;">add_circle</span>
              </div>
              <div style="flex:1;">
                <div style="font-size:13px;font-weight:700;color:var(--text-primary);">Create New Pair</div>
                <div style="font-size:11px;color:var(--text-muted);font-family:var(--font-mono);margin-top:1px;">Tap to add a custom token pair</div>
              </div>
              <span class="material-icons-round" id="create-pair-chevron" style="color:var(--text-muted);font-size:20px;transition:transform 0.3s;">expand_more</span>
            </div>

            <!-- Form body — hidden by default -->
            <div id="create-pair-body" style="display:none;padding:0 18px 18px;border-top:1px solid var(--border-subtle);">
              <!-- FROM token -->
              <div style="margin-top:14px;margin-bottom:12px;">
                <div class="config-label" style="font-size:10px;font-weight:700;color:var(--text-muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;font-family:var(--font-mono);">FROM TOKEN</div>
                <div style="display:flex;gap:8px;margin-bottom:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;" id="from-token-defaults"></div>
                <div style="display:flex;gap:8px;align-items:center;">
                  <input type="text" id="pair-from-addr" class="config-input" placeholder="0x… contract address" style="flex:1;font-family:var(--font-mono);font-size:11px;" oninput="onPairAddrInput('from')">
                  <input type="text" id="pair-from-sym" class="config-input" placeholder="SYM" style="width:64px;font-family:var(--font-mono);font-size:11px;text-transform:uppercase;" oninput="this.value=this.value.toUpperCase()">
                </div>
              </div>

              <!-- Swap direction arrow -->
              <div style="display:flex;justify-content:center;margin:6px 0;">
                <div onclick="swapPairDirection()" style="width:32px;height:32px;border-radius:9px;background:var(--bg-raised);border:1.5px solid var(--border-subtle);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);" onmousedown="this.style.transform='rotate(180deg) scale(0.85)'" onmouseup="this.style.transform=''" ontouchstart="this.style.transform='rotate(180deg) scale(0.85)'" ontouchend="this.style.transform=''">
                  <span class="material-icons-round" style="font-size:17px;color:var(--accent-primary)">swap_vert</span>
                </div>
              </div>

              <!-- TO token -->
              <div style="margin-bottom:14px;">
                <div class="config-label" style="font-size:10px;font-weight:700;color:var(--text-muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;font-family:var(--font-mono);">TO TOKEN</div>
                <div style="display:flex;gap:8px;margin-bottom:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;" id="to-token-defaults"></div>
                <div style="display:flex;gap:8px;align-items:center;">
                  <input type="text" id="pair-to-addr" class="config-input" placeholder="0x… contract address" style="flex:1;font-family:var(--font-mono);font-size:11px;" oninput="onPairAddrInput('to')">
                  <input type="text" id="pair-to-sym" class="config-input" placeholder="SYM" style="width:64px;font-family:var(--font-mono);font-size:11px;text-transform:uppercase;" oninput="this.value=this.value.toUpperCase()">
                </div>
              </div>

              <!-- Pair label -->
              <div style="margin-bottom:14px;">
                <div class="config-label" style="font-size:10px;font-weight:700;color:var(--text-muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;font-family:var(--font-mono);">PAIR LABEL <span style="color:var(--text-muted);font-weight:400;">(optional)</span></div>
                <input type="text" id="pair-label" class="config-input" placeholder="e.g. WETH ↔ USDC" style="font-family:var(--font-mono);font-size:11px;width:100%;">
              </div>

              <!-- Preview box -->
              <div id="pair-preview-box" style="display:none;background:rgba(99,102,241,0.08);border:1px solid rgba(99,102,241,0.25);border-radius:12px;padding:12px 14px;margin-bottom:12px;">
                <div style="font-size:9px;font-weight:700;color:var(--text-muted);letter-spacing:1.5px;font-family:var(--font-mono);margin-bottom:8px;">PREVIEW</div>
                <div id="pair-preview-content" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;"></div>
              </div>

              <!-- Save button -->
              <button onclick="savePairAndSelect()" style="width:100%;padding:12px;background:linear-gradient(135deg,var(--accent-primary),var(--accent-secondary));border:none;border-radius:var(--radius-md);color:#fff;font-family:var(--font-display);font-size:13px;font-weight:800;letter-spacing:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all 0.2s ease;box-shadow:var(--glow-primary);">
                <span class="material-icons-round" style="font-size:16px;">bookmark_add</span>
                SAVE PAIR &amp; SELECT
              </button>
            </div>
          </div>

          <div style="display:flex;gap:10px;margin-top:4px;">
            <button class="swap-btn" style="background:var(--bg-raised);box-shadow:none;flex:0 0 48px;padding:0;" onclick="goToStep1()">
              <span class="material-icons-round" style="font-size:20px;">arrow_back</span>
            </button>
            <button class="swap-btn" id="step2-next-btn" style="flex:1;" onclick="goToStep3()">
              Configure Swap
            </button>
          </div>
        </div>
