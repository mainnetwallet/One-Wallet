    <!-- ╔══════ HOME PAGE ══════╗ -->
    <div class="page active" id="page-home" style="padding-bottom:0!important;overflow:hidden;display:flex;flex-direction:column;">

      <!-- static top -->
      <div style="flex-shrink:0;">



      <!-- Exchange / Wallet toggle -->
      <div style="display:grid;grid-template-columns:38px 1fr 38px;align-items:center;padding:8px 16px 2px;">
        <div></div>
        <div style="display:flex;justify-content:center;">
                <div id="home-mode-toggle" style="display:flex;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);border-radius:22px;padding:3px;gap:2px;">
          <div id="home-mode-wallet" onclick="homeSetMode('wallet')" style="padding:6px 28px;border-radius:18px;font-size:13px;font-weight:500;font-family:var(--font-ui);cursor:pointer;transition:all 0.22s ease;background:var(--accent-primary);color:#fff;-webkit-tap-highlight-color:transparent;">Wallet</div>
          <div id="home-mode-exchange" onclick="homeSetMode('exchange')" style="padding:6px 28px;border-radius:18px;font-size:13px;font-weight:500;font-family:var(--font-ui);cursor:pointer;transition:all 0.22s ease;background:transparent;color:rgba(255,255,255,0.45);-webkit-tap-highlight-color:transparent;">Exchange</div>
        </div>
        </div>
        <div id="home-scan-btn" onclick="homeScanBtnClick()" role="button" aria-label="Scan QR code" style="width:38px;height:38px;display:flex;align-items:center;justify-content:center;background:var(--bg-glass);border:1px solid var(--border-subtle);border-radius:10px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform 0.15s ease;" ontouchstart="this.style.transform='scale(0.93)'" ontouchend="this.style.transform=''">
          <span class="material-icons-round" style="font-size:22px;color:var(--accent-primary)">qr_code_scanner</span>
        </div>
      </div>

      <!-- Top row: Wallet pill + Network pill -->
      <div style="display:flex;gap:8px;padding:6px 16px 6px;align-items:center;justify-content:space-between;">

        <!-- WALLET pill -->
        <div style="position:relative;flex-shrink:0;display:flex;flex-direction:row;align-items:center;gap:4px;">

          <!-- Empty state -->
          <div id="hw-empty" onclick="hwOpenGroupPicker()" style="display:flex;align-items:center;gap:4px;border-radius:10px;padding:6px 10px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);cursor:pointer;-webkit-tap-highlight-color:transparent;">
            <span class="material-icons-round" style="font-size:14px;color:rgba(255,255,255,0.5);">account_balance_wallet</span>
            <span style="font-size:9px;font-weight:700;font-family:var(--font-mono);color:rgba(255,255,255,0.3);">NO WALLET</span>
          </div>

          <!-- Wallet switcher — GROUP pill only -->
          <div id="hw-list" style="display:none;flex-direction:row;align-items:center;gap:5px;">

            <!-- hidden selects (logic unchanged) -->
            <select id="home-group-select"  onchange="homeOnGroupChange()"  style="display:none;"></select>
            <select id="home-wallet-select" onchange="homeOnWalletChange()" style="display:none;"></select>

            <!-- GROUP pill (wallet icon, group name, address) -->
            <div id="hw-group-pill" onclick="hwOpenGroupPicker()" style="display:flex;flex-direction:row;align-items:center;gap:8px;cursor:pointer;-webkit-tap-highlight-color:transparent;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);border-radius:12px;padding:6px 10px;pointer-events:auto;max-width:calc(100vw - 150px);">
              <span class="material-icons-round" style="font-size:18px;color:var(--text-secondary);pointer-events:none;flex-shrink:0;">account_balance_wallet</span>
              <div style="display:flex;flex-direction:column;gap:1px;pointer-events:none;min-width:0;line-height:1.3;">
                <span id="hw-group-label" style="font-size:13px;font-weight:500;font-family:var(--font-ui);color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px;">—</span>
                <span id="hw-wallet-addr-label" style="font-size:11px;font-family:var(--font-mono);color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px;">—</span>
              </div>
              <span class="material-icons-round" style="font-size:16px;color:var(--text-secondary);pointer-events:none;flex-shrink:0;">expand_more</span>
              <span id="hw-group-total-value" style="display:none;">$0.00</span>
            </div>

            <div id="hw-addr-pill" style="display:none;cursor:pointer;-webkit-tap-highlight-color:transparent;"><div id="hw-addr-text"></div><div id="hw-wallet-index"></div></div>
          </div>
          <div class="portfolio-chips" id="home-wallet-chips" style="display:none;"></div>
        </div>

        <!-- TOTAL VALUE hidden placeholder (keeps JS references alive) -->
        <div id="hw-total-value-box" style="display:none;">
          <span id="hw-total-value-text">$0.00</span>
        </div>

        <!-- NETWORK pill -->
        <script>
        (function(){
          var CHAIN_KEY='one_active_chain';
          var CHAINS=[
            {chainId:null,   emoji:'🌐',name:'All networks', color:'#6366f1'},
            {chainId:8453,   emoji:'🔵',name:'BASE',     color:'#0052ff'},
            {chainId:1,      emoji:'⬡', name:'ETH',      color:'#627eea'},
            {chainId:42161,  emoji:'🔵',name:'ARBITRUM', color:'#28a0f0'},
            {chainId:10,     emoji:'🔴',name:'OPTIMISM', color:'#ff0420'},
            {chainId:137,    emoji:'⬡', name:'POLYGON',  color:'#8247e5'},
            {chainId:56,     emoji:'💛',name:'BNB',      color:'#f3ba2f'},
            {chainId:43114,  emoji:'🔺',name:'AVAX',     color:'#e84142'},
            {chainId:59144,  emoji:'◻️',name:'LINEA',    color:'#61dfff'},
            {chainId:534352, emoji:'📜',name:'SCROLL',   color:'#efc042'},
            {chainId:324,    emoji:'⚡',name:'ZKSYNC',   color:'#8c8dfc'},
          ];
          function rgb(hex){var h=hex.replace('#','');return parseInt(h.slice(0,2),16)+','+parseInt(h.slice(2,4),16)+','+parseInt(h.slice(4,6),16);}
          var chainId=null,chain=CHAINS[0],isAll=true;
          try{var v=localStorage.getItem(CHAIN_KEY);if(v&&v!=='null'){chainId=Number(v);isAll=false;chain=CHAINS.find(function(c){return c.chainId===chainId;})||{emoji:'🔗',name:'CHAIN '+chainId,color:'#6366f1'};}}catch(e){}
          var border=isAll?'rgba(255,255,255,0.12)':'rgba('+rgb(chain.color)+',0.5)';
          var bg=isAll?'rgba(255,255,255,0.07)':'rgba('+rgb(chain.color)+',0.12)';
          var html='<div class="chain-switch-btn" id="home-chain-btn" onclick="homeChainBtnClick()" style="position:relative;flex-shrink:0;border-radius:12px;padding:8px 10px;gap:6px;align-items:center;border-color:'+border+';background:'+bg+';">'
            +'<span id="home-chain-emoji" style="font-size:14px;line-height:1;display:flex;align-items:center;">'+(isAll?'<span class="material-icons-round" style="font-size:18px;color:var(--text-secondary);">language</span>':chain.emoji)+'</span>'
            +'<span id="home-chain-name" style="font-size:12px;font-weight:500;font-family:var(--font-ui);">'+chain.name+'</span>'
            +'<span id="home-chain-arrow" class="material-icons-round" style="font-size:16px;color:rgba(255,255,255,0.4);display:inline;">expand_more</span>'
            +'<span id="home-chain-dot" style="position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--accent-green);display:none;box-shadow:0 0 6px var(--accent-green);"></span>'
            +'</div>';
          document.currentScript.insertAdjacentHTML('afterend', html);
        })();
        </script>

      </div>

      <!-- Balance card (IDs are updated by home-portfolio-card-sync.js) -->
      <div id="home-portfolio-card" class="hm-balance">
        <div class="hm-balance-label">Total balance</div>
        <div id="home-portfolio-value" class="hm-balance-value">$0.00</div>
        <div id="home-pnl-row" class="hm-pnl">
          <span id="home-pnl-chip" class="hm-chip"><span id="home-pnl-icon" class="material-icons-round">trending_up</span><span id="home-pnl-pct">0.00%</span></span>
          <span id="home-pnl-usd" class="hm-pnl-usd"></span>
        </div>
        <div id="home-balance-meta" class="hm-balance-meta">
          <span><b id="home-pchip-tokens">—</b> tokens</span>
          <span class="hm-dot"></span>
          <span><b id="home-pchip-chains">—</b> networks</span>
        </div>
      </div>

      <!-- Hidden refs kept for script compatibility -->
      <div style="display:none;">
        <div id="home-greeting-sub"></div>
        <div id="home-greeting-main"></div>
        <div id="home-portfolio-change"><span id="home-portfolio-change-text">+0.00%</span></div>
        <div id="home-portfolio-chips"><div id="home-pchip-pnl"></div></div>
      </div>

      <!-- Main actions -->
      <div class="hm-actions">
        <div class="hm-act" onclick="event.stopPropagation();openSendModal();rippleEffect(this,event)" ontouchend="event.stopPropagation();event.preventDefault();openSendModal();rippleEffect(this,event)">
          <div class="hm-act-icon" style="background:rgba(245,158,11,0.26);color:var(--accent-amber);"><span class="material-icons-round">north_east</span></div>
          <span class="hm-act-label">Send</span>
        </div>
        <div class="hm-act" onclick="event.stopPropagation();openReceiveModal();rippleEffect(this,event)" ontouchend="event.stopPropagation();event.preventDefault();openReceiveModal();rippleEffect(this,event)">
          <div class="hm-act-icon" style="background:rgba(16,185,129,0.26);color:var(--accent-green);"><span class="material-icons-round">south_west</span></div>
          <span class="hm-act-label">Receive</span>
        </div>
        <div class="hm-act" onclick="event.stopPropagation();switchPage('swap');rippleEffect(this,event)" ontouchend="event.stopPropagation();event.preventDefault();switchPage('swap');rippleEffect(this,event)">
          <div class="hm-act-icon" style="background:rgba(99,102,241,0.28);color:var(--neon-purple);"><span class="material-icons-round">swap_horiz</span></div>
          <span class="hm-act-label">Swap</span>
        </div>
        <div class="hm-act" onclick="event.stopPropagation();switchPage('bridge');rippleEffect(this,event)" ontouchend="event.stopPropagation();event.preventDefault();switchPage('bridge');rippleEffect(this,event)">
          <div class="hm-act-icon" style="background:rgba(34,211,238,0.26);color:var(--neon-cyan);"><span class="material-icons-round">alt_route</span></div>
          <span class="hm-act-label">Bridge</span>
        </div>
      </div>

      <!-- Tokens header -->
      <div style="display:flex;align-items:center;gap:8px;padding:0 16px 8px;">
        <div style="padding:0;flex-shrink:0;font-size:13px;font-weight:500;font-family:var(--font-ui);color:var(--text-primary);">My tokens</div>
        <!-- Inline token search -->
        <div style="flex:1;position:relative;">
          <span class="material-icons-round" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:19px;color:var(--text-secondary);pointer-events:none;">search</span>
          <input id="home-token-search" type="text"
            style="width:100%;background:var(--bg-glass);border:1px solid var(--border-subtle);border-radius:10px;height:38px;box-sizing:border-box;padding:0 32px 0 36px;font-family:var(--font-ui);font-size:13px;color:var(--text-primary);outline:none;"
            placeholder="Search tokens"
            oninput="homeFilterTokens(this.value)"
            autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
          <span id="home-token-search-clear" onclick="homeFilterTokens('');document.getElementById('home-token-search').value='';"
            style="display:none;position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer;">
            <span class="material-icons-round" style="font-size:18px;color:var(--text-secondary);">close</span>
          </span>
        </div>
        <div id="home-manage-btn" onclick="homeManageBtnClick()" style="display:flex;align-items:center;justify-content:center;gap:4px;cursor:pointer;width:38px;height:38px;padding:0;background:var(--bg-glass);border:1px solid var(--border-subtle);border-radius:10px;transition:all 0.2s ease;flex-shrink:0;position:relative;z-index:2;" onmousedown="homeManageBtnPress(this,true)" onmouseup="homeManageBtnPress(this,false)" ontouchstart="homeManageBtnPress(this,true);this._tsy=event.touches[0].clientY;" ontouchend="homeManageBtnPress(this,false);event.preventDefault();if(!this.dataset.wgDisabled&&Math.abs(event.changedTouches[0].clientY-(this._tsy||0))<8){openTokenManager();}">
          <span class="material-icons-round" style="font-size:22px;color:var(--accent-primary)">manage_search</span>
        </div>
      </div>

      </div><!-- /static top -->

      <!-- only token list scrolls -->
      <div id="home-token-scroll" style="flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:calc(var(--nav-height) + env(safe-area-inset-bottom, 0px) + 8px);position:relative;overscroll-behavior-y:contain;">

        <div id="token-list">
          <!-- skeleton -->
          <div class="skel-card skeleton skel-row" id="skel1"><i class="sk-ic"></i><span class="sk-col"><b class="sk-bar" style="width:84px;"></b><b class="sk-bar sm"></b></span><b class="sk-bar" style="width:46px;"></b></div>
          <div class="skel-card skeleton skel-row" id="skel2"><i class="sk-ic"></i><span class="sk-col"><b class="sk-bar" style="width:96px;"></b><b class="sk-bar sm"></b></span><b class="sk-bar" style="width:46px;"></b></div>
          <div class="skel-card skeleton skel-row" id="skel3"><i class="sk-ic"></i><span class="sk-col"><b class="sk-bar" style="width:70px;"></b><b class="sk-bar sm"></b></span><b class="sk-bar" style="width:46px;"></b></div>
        </div>
        <div class="scroll-pad"></div>
      </div>

    </div>
