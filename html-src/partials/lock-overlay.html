<!-- ── ONE APP LOCK SCREEN ── -->
<div id="one-lock-overlay" style="display:flex;position:fixed;inset:0;z-index:99999;background:var(--bg-void);flex-direction:column;align-items:center;justify-content:center;font-family:var(--font-display);">

  <!-- Logo -->
  <div style="margin-bottom:8px;">
    <svg width="44" height="44" viewBox="0 0 48 48" fill="none"><polygon points="24,2 42,12 42,36 24,46 6,36 6,12" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/><polygon points="24,7 38,15 38,33 24,41 10,33 10,15" fill="url(#lg1)" opacity="0.18"/><polygon points="24,12 34,18 34,30 24,36 14,30 14,18" fill="url(#lg2)" opacity="0.35"/><path d="M18 30 L18 18 L24 27 L30 18 L30 30" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="24" cy="2" r="2" fill="rgba(163,139,250,0.9)"/><circle cx="42" cy="12" r="2" fill="rgba(34,211,238,0.9)"/><circle cx="42" cy="36" r="2" fill="rgba(34,211,238,0.9)"/><circle cx="24" cy="46" r="2" fill="rgba(163,139,250,0.9)"/><circle cx="6" cy="36" r="2" fill="rgba(34,211,238,0.9)"/><circle cx="6" cy="12" r="2" fill="rgba(163,139,250,0.9)"/><circle cx="24" cy="24" r="2.5" fill="white" opacity="0.9"/><defs><linearGradient id="lg1" x1="6" y1="2" x2="42" y2="46" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#22d3ee"/></linearGradient><linearGradient id="lg2" x1="6" y1="2" x2="42" y2="46" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient></defs></svg>
  </div>
  <div style="font-size:20px;font-weight:800;letter-spacing:3px;color:var(--text-primary);margin-bottom:4px;">ONE WALLET</div>
  <div style="font-size:10px;font-family:var(--font-mono);color:var(--text-muted);letter-spacing:2px;margin-bottom:24px;">LOCKED</div>

  <!-- ═══ BIOMETRIC PANEL ═══ -->
  <div id="nlk-bio-panel" style="display:none;flex-direction:column;align-items:center;gap:16px;width:100%;max-width:320px;padding:0 24px;">
    <div id="nlk-bio-icon" style="width:80px;height:80px;border-radius:50%;background:rgba(99,102,241,0.12);border:2px solid rgba(99,102,241,0.35);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s;" onclick="oneLock._triggerBio()">
      <span class="material-icons-round" id="nlk-bio-glyph" style="font-size:38px;color:var(--accent-primary)">fingerprint</span>
    </div>
    <div id="nlk-bio-msg" style="font-size:13px;color:var(--text-secondary);text-align:center;">Touch sensor or scan face to unlock</div>
    <div id="nlk-bio-alt-btns" style="display:flex;gap:10px;margin-top:4px;flex-wrap:wrap;justify-content:center;"></div>
  </div>

  <!-- ═══ PIN PANEL ═══ -->
  <div id="nlk-pin-panel" style="display:none;flex-direction:column;align-items:center;gap:0;width:100%;max-width:340px;padding:0 20px;">
    <div style="font-size:11px;font-family:var(--font-mono);letter-spacing:3px;text-transform:uppercase;color:var(--text-muted);margin-bottom:20px;">Enter PIN</div>
    <div id="nlk-pin-dots" style="display:flex;gap:20px;margin-bottom:32px;align-items:center;">
      <div class="nlk-dot" id="nlk-dot-0"></div>
      <div class="nlk-dot" id="nlk-dot-1"></div>
      <div class="nlk-dot" id="nlk-dot-2"></div>
      <div class="nlk-dot" id="nlk-dot-3"></div>
      <div class="nlk-dot" id="nlk-dot-4"></div>
      <div class="nlk-dot" id="nlk-dot-5"></div>
    </div>
    <div id="nlk-keypad" style="display:grid;grid-template-columns:repeat(3,72px);row-gap:14px;column-gap:22px;width:fit-content;margin:0 auto;">
      <button class="nlk-key" onclick="oneLock._pinKey('1')">1</button>
      <button class="nlk-key" onclick="oneLock._pinKey('2')">2<span class="nlk-key-letters">ABC</span></button>
      <button class="nlk-key" onclick="oneLock._pinKey('3')">3<span class="nlk-key-letters">DEF</span></button>
      <button class="nlk-key" onclick="oneLock._pinKey('4')">4<span class="nlk-key-letters">GHI</span></button>
      <button class="nlk-key" onclick="oneLock._pinKey('5')">5<span class="nlk-key-letters">JKL</span></button>
      <button class="nlk-key" onclick="oneLock._pinKey('6')">6<span class="nlk-key-letters">MNO</span></button>
      <button class="nlk-key" onclick="oneLock._pinKey('7')">7<span class="nlk-key-letters">PQRS</span></button>
      <button class="nlk-key" onclick="oneLock._pinKey('8')">8<span class="nlk-key-letters">TUV</span></button>
      <button class="nlk-key" onclick="oneLock._pinKey('9')">9<span class="nlk-key-letters">WXYZ</span></button>
      <div style="width:72px;height:72px;visibility:hidden;"></div>
      <button class="nlk-key" onclick="oneLock._pinKey('0')">0<span class="nlk-key-letters">+</span></button>
      <button class="nlk-key nlk-key-alt" onclick="oneLock._pinBackspace()"><span class="material-icons-round" style="font-size:22px;">backspace</span></button>
    </div>
    <div id="nlk-pin-err" style="margin-top:16px;font-size:12px;color:var(--accent-red);min-height:16px;text-align:center;"></div>
    <div id="nlk-pin-alt-btns" style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;justify-content:center;"></div>
  </div>

  <!-- ═══ PATTERN PANEL ═══ -->
  <div id="nlk-pattern-panel" style="display:none;flex-direction:column;align-items:center;gap:0;width:100%;max-width:320px;padding:0 24px;">
    <div style="font-size:13px;color:var(--text-secondary);margin-bottom:16px;">Draw your pattern</div>
    <canvas id="nlk-pattern-canvas" width="270" height="270" style="touch-action:none;cursor:crosshair;border-radius:16px;"></canvas>
    <div id="nlk-pat-err" style="margin-top:12px;font-size:12px;color:var(--accent-red);min-height:16px;"></div>
    <div id="nlk-pat-alt-btns" style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;justify-content:center;"></div>
  </div>
</div>
